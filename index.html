<html lang="ja" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かぞえ島 Kazoe Island</title>
<meta name="google" content="notranslate">
<meta name="theme-color" content="#5fbfd8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="かぞえ島">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="description" content="場合の数 structure game: series (×) or parallel (+), P or C or nʳ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* Layout: one centered island screen (max 1000px). Map + signboard list; a chapter = host speech bubble over a railway board you build. */
:root{
  --sea:#8ed6e6; --sea2:#5fbfd8; --grass:#a9db86; --grass2:#7dc26a; --sand:#f5e3ad;
  --paper:#fffdf7; --paper2:#f4f8ec; --ink:#3d3751; --muted:#77718c; --line:#e2dccb;
  --rail:#a8774f; --rail2:#7d5434; --sun:#ffc94d; --sun2:#e3a82a; --berry:#ff6f91; --berry2:#d94a6d;
  --tP:#ff8f45; --tC:#8b6fd6; --tW:#2fb0c6; --tN:#6aa65a; --neg:#e0566f; --ok:#3fae68; --hint:#fff3c6;
  --f-display:"Fredoka","M PLUS Rounded 1c","Noto Sans SC","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --f-body:"M PLUS Rounded 1c","Noto Sans SC","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --r-lg:22px; --r-md:14px;
  color-scheme:light;
}
html[lang="zh"]{ --f-body:"Noto Sans SC","M PLUS Rounded 1c",system-ui,sans-serif; --f-display:"Fredoka","Noto Sans SC",system-ui,sans-serif }
*{box-sizing:border-box}
body{margin:0;background:
  radial-gradient(circle at 12px 12px, rgba(255,255,255,.28) 0 2.5px, transparent 3.5px) 0 0/44px 44px,
  linear-gradient(180deg,var(--sea),var(--sea2)) fixed;
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.app{max-width:1000px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
ruby rt{font-size:.5em;color:var(--muted)}
b{color:var(--berry2)}

/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.logo{font-family:var(--f-display);font-weight:700;font-size:1.6rem;color:#fff;letter-spacing:.02em;
  text-shadow:0 3px 0 var(--sea2),2px 2px 0 var(--sea2),-2px 2px 0 var(--sea2);background:none;border:0;padding:0}
.top .sp{flex:1}
.pill{border:0;border-radius:999px;background:var(--paper);padding:6px 12px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.12);display:inline-flex;align-items:center;gap:6px;min-height:40px}
.pill.on{background:var(--sun)}
.langs{display:flex;gap:4px;background:rgba(255,255,255,.35);padding:3px;border-radius:999px}
.langs .pill{box-shadow:none;padding:4px 10px;min-height:34px;background:transparent}
.langs .pill.on{background:var(--paper)}
.flowers-n{font-variant-numeric:tabular-nums}

/* generic */
.panel{background:var(--paper);border-radius:var(--r-lg);padding:18px;box-shadow:0 6px 0 rgba(40,90,110,.18)}
.btn{border:0;border-radius:999px;background:var(--sun);padding:10px 22px;font-weight:800;font-size:1.05rem;box-shadow:0 4px 0 var(--sun2);min-height:48px;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sun2)}
.btn.berry{background:var(--berry);color:#fff;box-shadow:0 4px 0 var(--berry2)}
.btn.ghost{background:var(--paper2);box-shadow:0 4px 0 var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
h2{font-size:1.45rem} h3{font-size:1.15rem}
.stack{display:grid;gap:14px}
.stack>*,.panel>*,.lesson>*{min-width:0}

/* critters */
.critter{display:block;overflow:visible}
.bob{animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.02,.98)}}
.hop{animation:hop .6s ease}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-18px) rotate(-6deg)}70%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}

/* title */
.title-card{text-align:center;display:grid;gap:16px;justify-items:center;padding:26px 18px}
.title-card h1{font-size:clamp(2.2rem,7vw,3.4rem);color:var(--ink)}
.parade{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.parade .critter:nth-child(2n){animation-delay:-.6s}.parade .critter:nth-child(3n){animation-delay:-1.2s}
.field{display:grid;gap:6px;justify-items:center}
.field input{font:inherit;font-size:1.15rem;padding:10px 16px;border-radius:999px;border:3px solid var(--line);text-align:center;width:min(280px,100%);background:#fff;color:var(--ink)}
.buddies{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.buddy{border:3px solid transparent;border-radius:var(--r-md);background:var(--paper2);padding:6px 10px 8px;display:grid;justify-items:center;font-weight:700}
.buddy.on{border-color:var(--berry);background:#fff}

/* map */
.map{position:relative;width:100%;aspect-ratio:1000/620;max-width:100%;border-radius:var(--r-lg);overflow:hidden;box-shadow:0 6px 0 rgba(40,90,110,.18)}
.map svg.art{position:absolute;inset:0;width:100%;height:100%}
.loc{position:absolute;transform:translate(-50%,-62%);border:0;background:none;padding:0;display:grid;justify-items:center;gap:0}
.loc .plate{background:var(--paper);border-radius:999px;padding:1px 9px;font-weight:800;font-size:.78rem;box-shadow:0 2px 0 rgba(0,0,0,.15);white-space:nowrap}
.loc.locked{filter:grayscale(.9) opacity(.7)}
.loc.done .plate::after{content:" ★";color:var(--sun2)}
.loc .num{position:absolute;top:-4px;left:-6px;background:var(--ink);color:#fff;border-radius:50%;width:22px;height:22px;font-size:.75rem;display:grid;place-items:center;font-weight:800}
@media (max-width:620px){.loc .plate{display:none}.loc svg{width:46px;height:46px}}
.board-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:14px}
.chcard{display:grid;grid-template-columns:64px 1fr;gap:4px 12px;align-items:center;text-align:left;border:0;background:var(--paper);border-radius:var(--r-lg);padding:12px 14px;box-shadow:0 5px 0 rgba(40,90,110,.18)}
.chcard .critter{grid-row:span 2}
.chcard .t{font-weight:800;font-family:var(--f-display);font-size:1.05rem}
.chcard .s{font-size:.88rem;color:var(--muted)}
.chcard.locked{opacity:.55}
.chcard .st{justify-self:start;font-size:.75rem;font-weight:800;border-radius:999px;padding:0 8px;background:var(--paper2)}
.chcard .st.done{background:var(--sun)}
.review{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--hint);border-radius:var(--r-lg);padding:12px 16px;margin-top:14px;box-shadow:0 5px 0 rgba(160,120,20,.2)}
.review .txt{flex:1;min-width:200px}

/* chapter */
.chhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chhead h2{color:#fff;text-shadow:0 2px 0 var(--sea2);flex:1 1 240px;min-width:0}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.55);display:block}
.dots i.on{background:var(--sun)} .dots i.cur{background:#fff;outline:3px solid var(--sun)}
.talk{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:end;margin-bottom:12px}
.bubble{position:relative;background:var(--paper);border-radius:26px;padding:14px 18px 14px;box-shadow:0 5px 0 rgba(40,90,110,.18);min-width:0}
.bubble::before{content:"";position:absolute;left:-10px;bottom:18px;border:10px solid transparent;border-right-color:var(--paper);border-left:0}
.bubble .who{position:absolute;top:-13px;left:18px;border-radius:999px;padding:0 12px;font-weight:800;font-size:.85rem;color:#fff}
.bubble .say{font-size:1.06rem;min-height:1.6em}
.bubble .nx{float:right;border:0;background:var(--sun);border-radius:999px;width:38px;height:38px;font-weight:900;box-shadow:0 3px 0 var(--sun2);margin-left:8px}
.lesson{display:grid;gap:12px}
.lesson .big{font-size:1.1rem}
.rule{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;background:var(--paper2);border-radius:var(--r-md);padding:12px}
.op{font-family:var(--f-display);font-weight:700;font-size:1.5rem;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff}
.op.mul{background:var(--rail)} .op.add{background:var(--tN)} .op.sub{background:var(--neg)}
.typegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tcard{border-radius:var(--r-md);padding:10px 12px;color:#fff}
.tcard .k{font-family:var(--f-display);font-size:1.4rem;font-weight:700}
.tcard.P{background:var(--tP)}.tcard.C{background:var(--tC)}.tcard.W{background:var(--tW)}.tcard.N{background:var(--tN)}
.qtable{border-collapse:separate;border-spacing:4px;width:100%;font-size:.92rem}
.qtable th,.qtable td{padding:6px 8px;border-radius:10px;text-align:center}
.qtable th{background:var(--paper2)}
.tw{overflow-x:auto}

/* railway board */
.story{font-size:1.12rem;background:var(--paper);border-radius:var(--r-lg);padding:14px 18px;box-shadow:0 5px 0 rgba(40,90,110,.18)}
.story .tag{display:inline-block;font-size:.75rem;font-weight:800;background:var(--paper2);border-radius:999px;padding:0 10px;margin-bottom:4px;color:var(--muted)}
.rail{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:stretch;background:linear-gradient(var(--grass),var(--grass2));border-radius:var(--r-lg);padding:14px 10px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.endpt{display:grid;place-items:center;font-size:1.7rem;align-self:center;background:var(--paper);border-radius:50%;width:48px;height:48px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.lanes{display:grid;gap:10px;position:relative;min-width:0;border-left:6px solid var(--rail);border-right:6px solid var(--rail);border-radius:12px;padding:4px 8px}
.lanes.single{border-color:transparent}
.lane{display:flex;align-items:center;gap:8px;position:relative;min-width:0}
.lane .track{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;position:relative;padding:6px 4px;min-width:0;
  background:repeating-linear-gradient(90deg,transparent 0 10px,var(--rail2) 10px 13px) center/100% 14px no-repeat;}
.lane .track::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-7px;background:var(--rail);z-index:0}
.lane .track::after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:3px;background:var(--rail);z-index:0}
.lane.neg .track::before,.lane.neg .track::after{background:var(--neg)}
.times{position:relative;z-index:1;font-family:var(--f-display);font-weight:700;color:#fff;background:var(--rail2);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:.9rem}
.sign{z-index:1;border:0;border-radius:50%;width:36px;height:36px;font-family:var(--f-display);font-weight:700;font-size:1.2rem;color:#fff;background:var(--tN);flex:none}
.lane.neg .sign{background:var(--neg)}
.sign[disabled]{opacity:1}
.stn{position:relative;z-index:1;border:3px solid #fff;border-radius:16px;min-width:84px;padding:6px 8px 5px;display:grid;justify-items:center;gap:0;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);line-height:1.15}
.stn.N{background:var(--tN)}.stn.P{background:var(--tP)}.stn.C{background:var(--tC)}.stn.W{background:var(--tW)}
.stn.empty{background:#fff;color:var(--muted);border-style:dashed;border-color:var(--rail)}
.stn.sel{outline:4px solid var(--sun);outline-offset:2px}
.stn .sym{font-family:var(--f-display);font-weight:700;font-size:1.35rem}
.stn .sym sub{font-size:.62em;vertical-align:-.25em}
.stn .sym sup{font-size:.62em}
.stn .cap{font-size:.72rem;opacity:.95}
.stn .val{font-size:.8rem;font-weight:800;background:rgba(255,255,255,.28);border-radius:999px;padding:0 6px;margin-top:2px}
.stn .lab{font-size:.72rem;font-weight:700;background:rgba(0,0,0,.18);border-radius:8px;padding:1px 6px;margin-top:3px;max-width:150px}
.stn.flash{animation:flash .5s ease}
@keyframes flash{50%{transform:scale(1.12)}}
.addst{z-index:1;border:3px dashed #fff;background:rgba(255,255,255,.35);border-radius:14px;min-height:56px;padding:0 10px;font-weight:800;color:var(--ink)}
.dellane{z-index:1;border:0;background:rgba(255,255,255,.6);border-radius:50%;width:30px;height:30px;font-weight:900;flex:none}
.lanecount{z-index:1;font-family:var(--f-display);font-weight:700;background:var(--paper);border-radius:999px;padding:2px 10px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.lanecount:empty{display:none}
.addlane{border:3px dashed var(--rail);background:rgba(255,255,255,.5);border-radius:14px;padding:6px 12px;font-weight:800;justify-self:start}
.goalbox{font-family:var(--f-display);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.train{position:absolute;z-index:3;top:50%;left:0;transform:translate(-50%,-70%);transition:left .55s ease;pointer-events:none}

/* editor */
.editor{background:var(--paper);border-radius:var(--r-lg);padding:14px;display:grid;gap:12px;box-shadow:0 5px 0 rgba(40,90,110,.18)}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tbtn{border:3px solid transparent;border-radius:14px;padding:8px 4px;color:#fff;font-weight:800;display:grid;justify-items:center;line-height:1.2}
.tbtn .k{font-family:var(--f-display);font-size:1.3rem}
.tbtn small{font-size:.72rem;opacity:.95}
.tbtn.N{background:var(--tN)}.tbtn.P{background:var(--tP)}.tbtn.C{background:var(--tC)}.tbtn.W{background:var(--tW)}
.tbtn.on{border-color:var(--ink);transform:translateY(-2px)}
.steppers{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .lbl{font-weight:700;font-size:.9rem;color:var(--muted)}
.stepper button{border:0;width:44px;height:44px;border-radius:50%;background:var(--paper2);font-size:1.4rem;font-weight:900;box-shadow:0 3px 0 var(--line)}
.stepper .v{font-family:var(--f-display);font-size:1.6rem;font-weight:700;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.tdesc{background:var(--paper2);border-radius:12px;padding:8px 12px;font-size:.95rem}

/* feedback */
.fb{border-radius:var(--r-lg);padding:14px 16px;display:grid;gap:8px}
.fb.ok{background:#e4f7e9}
.fb.no{background:var(--hint)}
.fb .h{font-weight:800;font-size:1.08rem}
.fb.ok .h{color:var(--ok)}
.why{background:var(--paper2);border-radius:var(--r-md);padding:10px 14px}
.cheer{display:flex;gap:10px;align-items:center}

/* modal */
.veil{position:fixed;inset:0;background:rgba(40,60,80,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--paper);border-radius:28px;padding:22px;max-width:520px;width:100%;display:grid;gap:12px;text-align:center;justify-items:center;max-height:90vh;overflow:auto}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px 9px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}

/* dex & table */
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.dexc{background:var(--paper);border-radius:var(--r-md);padding:10px;display:grid;justify-items:center;text-align:center;gap:2px;font-size:.85rem}
.dexc.unk{opacity:.5}
.dexc .n{font-weight:800;font-size:1rem}
.moves{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.move{background:var(--paper);border-radius:var(--r-md);padding:12px;display:grid;gap:4px;border-left:0}
.move .mt{display:flex;gap:8px;align-items:center;font-weight:800}
.move .ty{font-size:.72rem;color:#fff;border-radius:999px;padding:0 8px}
.move.unk{opacity:.45}
.move .src{font-size:.75rem;color:var(--muted)}
.dist td.cell{background:var(--paper2);min-width:90px}
.dist td.cell.lit{background:var(--sun)}
.dist td.cell.lock{background:#e9e6ef;color:var(--muted)}
.dist td.cell b{color:var(--ink);font-family:var(--f-display)}
.bar{height:12px;border-radius:999px;background:var(--paper2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.ptable{width:100%;border-collapse:collapse;font-size:.92rem}
.ptable td,.ptable th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ptable .num{text-align:right;font-variant-numeric:tabular-nums}
.danger{background:var(--neg)!important;color:#fff!important;box-shadow:0 4px 0 #a83246!important}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:560px){
  .rail{grid-template-columns:1fr;padding:12px 8px}
  .rail>.endpt:first-child{display:none}
  .rail>.goalbox{justify-self:end;width:auto;min-width:48px;padding:0 12px;border-radius:999px;height:40px}
  .lanes{padding:4px 4px}
  .stn{min-width:72px}
  .types{grid-template-columns:repeat(2,1fr)}
  .talk .critter{width:56px;height:56px}
}
/* generic task inputs */
.figbox{display:grid;gap:10px;justify-items:center}
.figbox svg{max-width:100%;height:auto;display:block}
.tools{justify-content:center}
.pill.tool.on{background:var(--sun)}
.ansrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center}
.disp{min-width:120px;text-align:center;font-family:var(--f-display);font-size:2rem;font-weight:700;background:var(--paper2);border-radius:var(--r-md);padding:4px 14px;font-variant-numeric:tabular-nums}
.unit{font-weight:800;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,56px);gap:8px}
.pad button{border:0;height:52px;border-radius:14px;background:var(--paper2);font-family:var(--f-display);font-size:1.4rem;font-weight:700;box-shadow:0 3px 0 var(--line)}
.pad button.ok{background:var(--berry);color:#fff;box-shadow:0 3px 0 var(--berry2)}
.fracin{display:grid;justify-items:center;gap:4px}
.fracin .slot{min-width:80px;height:50px;border-radius:12px;border:3px solid var(--line);background:#fff;font-family:var(--f-display);font-size:1.6rem;font-weight:700}
.fracin .slot.on{border-color:var(--berry)}
.fracin .fbar{width:96px;height:4px;background:var(--ink);border-radius:2px}
.fhelp{font-size:.8rem;max-width:12em}
.fr{display:inline-grid;vertical-align:middle;text-align:center;line-height:1.1;font-size:.9em;margin:0 .1em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .15em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{border:3px solid var(--line);background:var(--paper);border-radius:var(--r-md);padding:12px 14px;font-weight:700;text-align:left;min-height:56px}
.opt.right{border-color:var(--ok);background:#e4f7e9}
.opt.wrongopt{opacity:.5;text-decoration:line-through}
.wbtn{width:max-content;position:absolute;transform:translate(-50%,0);border:0;background:var(--paper);border-radius:999px;padding:2px 12px 3px;font-weight:800;font-size:.85rem;box-shadow:0 3px 0 rgba(0,0,0,.15);display:grid;justify-items:center;line-height:1.2;white-space:nowrap}
.wbtn small{font-size:.7rem;color:var(--muted);font-weight:700}

.chipbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-weight:700;min-height:40px}

.decobar{display:grid;gap:10px;margin-bottom:10px}

.pad-grass{background:radial-gradient(ellipse at 50% 80%,#7cc46a 0 45%,transparent 46%);padding:0 22px 6px;display:grid;place-items:center;min-height:120px}

.hurt{animation:hurt .6s}@keyframes hurt{30%{transform:translateY(-14px) scale(1.06)}60%{transform:translateY(0) scale(.97)}}
.ball{font-size:3rem;display:inline-block;animation:bond 1.6s ease}@keyframes bond{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.25);opacity:1}55%{transform:scale(.95)}80%{transform:scale(1.08)}100%{transform:none}}
.field-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:repeating-linear-gradient(90deg,#8a5a3c 0 3px,#a97549 3px 40px);padding:12px;border-radius:var(--r-lg);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}

.plot.ripe{outline:4px solid var(--sun)}.plot .crop{font-size:2.4rem;line-height:1}.plot small{font-size:.75rem;font-weight:800}.plot .muted{color:#f3e6d6}
@media (max-width:520px){.field-grid{grid-template-columns:repeat(2,1fr)}}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}

.chcard.unread{outline:3px solid var(--berry)}
.evo .critter{animation:evo 1.4s ease-in-out infinite}@keyframes evo{50%{filter:brightness(2.4) saturate(0)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
// CORE-START
const AUDIT={on:false,list:[]};
function tx(ja,en,zh){const o={ja,en,zh};if(AUDIT.on)AUDIT.list.push(o);return o}
function range(n){return [...Array(n).keys()]}
function perms(arr,k=arr.length){if(k===0)return [[]];const out=[];arr.forEach((x,i)=>{const rest=arr.filter((_,j)=>j!==i);for(const p of perms(rest,k-1))out.push([x,...p])});return out}
function combs(arr,k){if(k===0)return [[]];if(arr.length<k)return [];const [f,...r]=arr;return [...combs(r,k-1).map(c=>[f,...c]),...combs(r,k)]}
function product(lists){return lists.reduce((acc,l)=>acc.flatMap(a=>l.map(x=>[...a,x])),[[]])}
function tuples(base,k){return product(Array(k).fill(range(base)))}
function fact(n){return n<=1?1:n*fact(n-1)}
function nPr(n,r){return r>n||r<0?0:fact(n)/fact(n-r)}
function nCr(n,r){return r>n||r<0?0:nPr(n,r)/fact(r)}
function compositions(total,parts,min){let c=0;(function go(left,p){if(p===parts-1){if(left>=min)c++;return}for(let x=min;x<=left;x++)go(left-x,p+1)})(total,0);return c}
function uniqPerms(letters){return new Set(perms(letters).map(p=>p.join(''))).size}

function leafVal(s){if(!s||!s.t)return NaN;const n=s.n,r=s.r;if(s.t==='N')return n;if(s.t==='P')return nPr(n,r);if(s.t==='C')return nCr(n,r);if(s.t==='W')return n**r;return NaN}
function exprVal(lanes){return lanes.reduce((a,l)=>a+(l.sign<0?-1:1)*l.st.reduce((m,s)=>m*leafVal(s),1),0)}
const st=(t,n,r,lab)=>({t,n,r:r||0,lab});
const ln=(sign,...s)=>({sign,st:s});
const M=(v,tag,t)=>({v,tag,t});
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
function sameVal(a,b){if(Array.isArray(a)&&Array.isArray(b))return a[0]*b[1]===b[0]*a[1];if(Array.isArray(a))return a[0]===b*a[1];if(Array.isArray(b))return b[0]===a*b[1];return a===b}

const coinPic=(k,n)=>range(n).map(i=>'○'.repeat(Math.floor(k/n)+(i<k%n?1:0))).join('|');
const NM={ja:['あおい','ゆい','はると','りこ','そうた','めい','かい'],en:['Aoi','Yui','Haru','Riko','Sota','Mei','Kai'],zh:['小葵','小唯','小春','莉子','小太','小美','小凯']};

// ---- problems: each chapter is a list; each problem has param sets; make(params) returns the problem ----
const PROBLEMS={
c1:[
 {id:'c1a',sets:[[3,2],[4,3]],make:([a,b])=>({
  story:tx(`島へ行くのに、船が${a}便、飛行機が${b}便あるよ。どれか1つに乗って行くとき、行き方は何通り?`,`To reach the island there are ${a} boats and ${b} planes. You ride just one of them. How many ways can you go?`,`去岛上有${a}班船和${b}班飞机，只坐其中一班。一共有几种去法？`),
  sol:[ln(1,st('N',a,0,tx('船で行く','by boat','坐船'))),ln(1,st('N',b,0,tx('飛行機で行く','by plane','坐飞机')))],
  brute:()=>[...range(a).map(i=>'b'+i),...range(b).map(i=>'p'+i)].length,
  mis:[M(a*b,'mulForAdd',tx(`船と飛行機の「両方」に乗る? 1回の旅で乗るのは、どちらか1つだけだね。同時に起きないことは分かれ道 → たし算。`,`Do you ride a boat AND a plane? One trip uses only one of them. Things that can't happen together are a fork → add.`,`你会既坐船又坐飞机吗？一次只坐一种。不会同时发生的事是岔路 → 相加。`))],
  why:tx(`船の旅と飛行機の旅は同時には起きない。だからルートを2本に分けて たす: ${a} + ${b} = ${a+b}`,`A boat trip and a plane trip never happen together, so they are two separate routes: ${a} + ${b} = ${a+b}.`,`坐船和坐飞机不会同时发生，所以分成两条路线相加：${a} + ${b} = ${a+b}`)})},
 {id:'c1b',sets:[[3,2],[4,3]],make:([a,b])=>({
  story:tx(`行きは船${a}便のどれか、帰りは飛行機${b}便のどれかに乗るよ。行きと帰りの決め方は何通り?`,`You go there on one of ${a} boats and come back on one of ${b} planes. How many ways to plan the round trip?`,`去的时候坐${a}班船中的一班，回来坐${b}班飞机中的一班。往返一共有几种安排？`),
  sol:[ln(1,st('N',a,0,tx('行きの船','boat there','去程的船')),st('N',b,0,tx('帰りの飛行機','plane back','回程的飞机')))],
  brute:()=>product([range(a),range(b)]).length,
  mis:[M(a+b,'addForMul',tx(`行き「そして」帰り。両方決めないと旅は1つできないね。行きの船1つごとに、帰りが${b}通りずつ → かけ算。`,`There AND back: you need both to make one trip. For each boat there are ${b} ways back → multiply.`,`去程“并且”回程：两个都定下来才是一次旅行。每一班去程船都对应${b}种回程 → 相乘。`))],
  why:tx(`行きを決めて、そして帰りを決める。両方そろって旅が1つ → 一本道: ${a} × ${b} = ${a*b}`,`Choose the way there, then the way back. Both together make one trip → one track: ${a} × ${b} = ${a*b}.`,`先定去程，再定回程，两样都有才是一次旅行 → 一条路：${a} × ${b} = ${a*b}`)})},
 {id:'c1c',sets:[[3,4,2],[2,5,3]],make:([a,b,c])=>({
  story:tx(`サンドイッチ屋さん。パン${a}しゅるい、なかみ${b}しゅるい、のみもの${c}しゅるいから1つずつえらぶよ。セットの作り方は何通り?`,`At the sandwich shop you pick one bread (${a} kinds), one filling (${b} kinds) and one drink (${c} kinds). How many different sets?`,`三明治店：面包${a}种、馅料${b}种、饮料${c}种，各选一种。一共能配出几种套餐？`),
  sol:[ln(1,st('N',a,0,tx('パン','bread','面包')),st('N',b,0,tx('なかみ','filling','馅料')),st('N',c,0,tx('のみもの','drink','饮料')))],
  brute:()=>product([range(a),range(b),range(c)]).length,
  mis:[M(a+b+c,'addForMul',tx(`パン・なかみ・のみもの、ぜんぶ決めてセットが1つ。全部そろうものは一本道 → かけ算。`,`Bread, filling and drink together make one set. When you need all of them, it's one track → multiply.`,`面包、馅料、饮料全部选好才是一份套餐。全都要的就是一条路 → 相乘。`))],
  why:tx(`3つとも決めてセットが1つ → 駅が3つの一本道: ${a} × ${b} × ${c} = ${a*b*c}`,`All three choices make one set → a track with 3 stations: ${a} × ${b} × ${c} = ${a*b*c}.`,`三样都选好才是一份 → 有3个站的一条路：${a} × ${b} × ${c} = ${a*b*c}`)})},
 {id:'c1d',sets:[[3,4,2],[2,3,3]],make:([a,b,c])=>({
  story:tx(`ランチは和食${a}しゅるい「または」洋食${b}しゅるいから1つ。そして、デザート${c}しゅるいから1つ。ランチの決め方は何通り?`,`For lunch you pick one dish: ${a} Japanese OR ${b} Western. Then one of ${c} desserts. How many lunches?`,`午饭从${a}种和食“或者”${b}种西餐里选一种，然后再从${c}种甜点里选一种。午饭一共有几种选法？`),
  sol:[ln(1,st('N',a,0,tx('和食','Japanese','和食')),st('N',c,0,tx('デザート','dessert','甜点'))),ln(1,st('N',b,0,tx('洋食','Western','西餐')),st('N',c,0,tx('デザート','dessert','甜点')))],
  brute:()=>product([range(a+b),range(c)]).length,
  mis:[M(a*b*c,'mulForAdd',tx(`和食と洋食を「両方」食べる? メインはどちらか1つだけ。そこは分かれ道だよ。`,`Do you eat a Japanese AND a Western dish? Only one main. That part is a fork.`,`你会同时吃和食和西餐吗？主菜只选一种，那里是岔路。`)),
       M(a+b+c,'addForMul',tx(`デザートは「または」じゃなくて「そして」。メインを決めたあとに、デザートも決めるね。`,`Dessert is AND, not OR: after the main dish you also pick a dessert.`,`甜点是“并且”不是“或者”：选完主菜还要选甜点。`)),
       M(a+b*c,'paren',tx(`デザートは和食ルートにもつくよ。どちらのルートでも、最後にデザートを決めよう。`,`The Japanese route gets a dessert too. On either route, you finish by picking a dessert.`,`和食路线也有甜点。不管走哪条路线，最后都要选甜点。`))],
  why:tx(`メインは和食か洋食のどちらか → 分かれ道。どちらのルートでもデザートを決める → それぞれ一本道。${a}×${c} + ${b}×${c} = (${a}+${b})×${c} = ${(a+b)*c}`,`The main dish is Japanese OR Western → a fork. On each route you also pick dessert → each route is a track. ${a}×${c} + ${b}×${c} = (${a}+${b})×${c} = ${(a+b)*c}.`,`主菜是和食或西餐 → 岔路；每条路线还要选甜点 → 每条都是一条路。${a}×${c} + ${b}×${c} = (${a}+${b})×${c} = ${(a+b)*c}`)})},
],
c2:[
 {id:'c2a',sets:[[5],[6]],make:([n])=>({
  story:tx(`${n}人の中から、リレーで1番目と2番目に走る人を決めるよ。決め方は何通り?`,`From ${n} kids, choose the 1st and 2nd runners of a relay. How many ways?`,`从${n}个人里选出接力赛的第1棒和第2棒。有几种选法？`),
  sol:[ln(1,st('P',n,2,tx('1番目と2番目','1st and 2nd runner','第1棒和第2棒')))],
  brute:()=>perms(range(n),2).length,
  mis:[M(nCr(n,2),'CforP',tx(`1番目あおい・2番目ゆい と 1番目ゆい・2番目あおい は、ちがう決め方だね。順番があるから C じゃなくて P。`,`Aoi 1st & Yui 2nd is different from Yui 1st & Aoi 2nd. Order matters → P, not C.`,`小葵第1棒、小唯第2棒，和小唯第1棒、小葵第2棒，是不同的安排。有顺序 → 用 P 不用 C。`)),
       M(n*n,'repeat',tx(`同じ子が1番目と2番目の両方を走るのはムリだね。1人決めると、つぎに選べる人は1人へるよ。`,`The same kid can't run both legs. Once someone is used, one fewer is left.`,`同一个人不能同时跑两棒。用掉一个人，剩下的就少一个。`))],
  why:tx(`走る順番がある、同じ子は1回だけ → P。${n}P2 = ${n}×${n-1} = ${nPr(n,2)}`,`Order matters and nobody runs twice → P. ${n}P2 = ${n}×${n-1} = ${nPr(n,2)}.`,`有顺序、每人只能跑一次 → P。${n}P2 = ${n}×${n-1} = ${nPr(n,2)}`)})},
 {id:'c2b',sets:[[5,2],[6,3]],make:([n,r])=>({
  story:tx(`${n}人の中から、そうじ当番を${r}人選ぶよ。選び方は何通り?`,`From ${n} kids, pick ${r} for cleaning duty. How many ways?`,`从${n}个人里选${r}个人做值日。有几种选法？`),
  sol:[ln(1,st('C',n,r,tx(`当番${r}人`,`${r} on duty`,`${r}个值日生`)))],
  brute:()=>combs(range(n),r).length,
  mis:[M(nPr(n,r),'PforC',tx(`当番は「あおいとゆい」でも「ゆいとあおい」でも同じチーム。順番がないから P じゃなくて C。`,`"Aoi and Yui" is the same team as "Yui and Aoi". No order → C, not P.`,`“小葵和小唯”和“小唯和小葵”是同一组。没有顺序 → 用 C 不用 P。`))],
  why:tx(`当番に順番はない、同じ子は1回だけ → C。${n}C${r} = ${nCr(n,r)}`,`No order, nobody twice → C. ${n}C${r} = ${nCr(n,r)}.`,`值日没有顺序、每人只算一次 → C。${n}C${r} = ${nCr(n,r)}`)})},
 {id:'c2c',sets:[[4,3],[3,4]],make:([k,m])=>({
  story:tx(`${k}色のスタンプを、左から順に${m}回おすよ。同じ色を何回使ってもいい。もようは何通り?`,`You stamp ${m} times from left to right with ${k} colors. You may reuse a color. How many patterns?`,`用${k}种颜色的印章，从左到右盖${m}次，同一种颜色可以重复用。能盖出几种图案？`),
  sol:[ln(1,st('W',k,m,tx(`${k}色を${m}回`,`${k} colors, ${m} times`,`${k}种颜色盖${m}次`)))],
  brute:()=>tuples(k,m).length,
  mis:[...(m<=k?[M(nPr(k,m),'noRepeat',tx(`同じ色をまた使ってもいいよ。毎回${k}色の中から選べる → nʳ。`,`You may reuse colors. Each stamp has all ${k} colors → nʳ.`,`颜色可以重复用，每次都有${k}种可选 → nʳ。`))]:[]),
       M(m**k,'powDir',tx(`nʳ の向きに注意。n は「1回ごとに選べる数」(${k}色)、r は「選ぶ回数」(${m}回)。`,`Watch the direction: n = choices each time (${k} colors), r = how many times (${m}).`,`注意 nʳ 的方向：n 是“每次的选法”（${k}种颜色），r 是“决定几次”（${m}次）。`))],
  why:tx(`1回ごとに${k}通り、それを${m}回。同じ色OK → nʳ: ${k}^${m} = ${k**m}`,`${k} choices each time, ${m} times, reuse allowed → nʳ: ${k}^${m} = ${k**m}.`,`每次${k}种，做${m}次，可以重复 → nʳ：${k}^${m} = ${k**m}`)})},
 {id:'c2d',sets:[[3,4],[5,3]],make:([k,n])=>({
  story:tx(`はがきが${k}しゅるい(どれも何まいでもある)。友だち${n}人に1まいずつ送るよ。送り方は何通り?`,`There are ${k} kinds of postcards (plenty of each). You send one card to each of ${n} friends. How many ways?`,`明信片有${k}种（每种都有很多张）。给${n}个朋友每人寄一张，有几种寄法？`),
  src:'Lovász 1.1',
  sol:[ln(1,st('W',k,n,tx(`友だち${n}人それぞれ`,`each of ${n} friends`,`${n}个朋友各一张`)))],
  brute:()=>tuples(k,n).length,
  mis:[M(n**k,'powDir',tx(`友だち1人ずつ「どのはがき?」と決めるね。1回の選び方は${k}通り、決める回数は${n}人分 → ${k}^${n}。`,`Decide "which card?" once per friend: ${k} choices, ${n} times → ${k}^${n}.`,`给每个朋友决定“寄哪种”：每次${k}种，要决定${n}次 → ${k}^${n}。`)),
       ...(n<=k?[M(nPr(k,n),'noRepeat',tx(`2人に同じしゅるいのはがきを送ってもいいよ。だれでも毎回${k}しゅるいから選べる。`,`Two friends may get the same kind. Everyone can choose from all ${k}.`,`两个朋友可以收到同一种，每个人都有${k}种可选。`))]:[])],
  why:tx(`友だち1人ずつ ${k}通り、${n}人分。同じはがきOK → ${k}^${n} = ${k**n}`,`${k} choices per friend, ${n} friends, repeats OK → ${k}^${n} = ${k**n}.`,`每个朋友${k}种，共${n}人，可以重复 → ${k}^${n} = ${k**n}`)})},
 {id:'c2e',sets:[[6,3],[5,3]],make:([k,n])=>({
  story:tx(`ちがう絵のはがきが${k}まい(1まいずつ)。友だち${n}人に1まいずつ送るよ。送り方は何通り?`,`You have ${k} different postcards (one of each). Send one to each of ${n} friends. How many ways?`,`有${k}张图案各不相同的明信片（每种一张）。给${n}个朋友每人寄一张，有几种寄法？`),
  src:'Lovász 1.1',
  sol:[ln(1,st('P',k,n,tx(`${n}人に順に1まいずつ`,`one each to ${n} friends`,`依次给${n}人各一张`)))],
  brute:()=>perms(range(k),n).length,
  mis:[M(nCr(k,n),'CforP',tx(`あおいに花・ゆいに星 と、あおいに星・ゆいに花 はちがう送り方。だれにどのはがきを送るかで区別がある → P。`,`Aoi gets the flower & Yui the star differs from the reverse. Who gets what matters → P.`,`小葵收到花、小唯收到星，和反过来是不同的寄法。谁收到哪张有区别 → P。`)),
       M(k**n,'repeat',tx(`はがきは1まいずつしかない。だれかにあげたら、のこりは1まいへるよ。`,`There's only one of each card. After one is sent, one fewer is left.`,`每种只有一张，寄出一张就少一张。`))],
  why:tx(`1人目${k}通り、2人目${k-1}通り…同じはがきは使えない、だれに行くかで区別 → P。${k}P${n} = ${nPr(k,n)}`,`${k} for the first friend, ${k-1} for the next… no repeats, and who gets which matters → P. ${k}P${n} = ${nPr(k,n)}.`,`第1人${k}种、第2人${k-1}种……不能重复，谁收到哪张有区别 → P。${k}P${n} = ${nPr(k,n)}`)})},
 {id:'c2f',sets:[[3],[4]],make:([m])=>({
  story:tx(`0〜9の数字で${m}けたの[暗証|あんしょう]番号を作るよ。同じ数字を何回使ってもいいし、はじめの数字が0でもいいよ。番号は何通り?`,`Make a ${m}-digit PIN from the digits 0–9. Digits may repeat, and a leading 0 is fine. How many PINs?`,`用0〜9组成${m}位密码，数字可以重复，首位是0也可以。有几种密码？`),

  brute:()=>tuples(10,m).length,
  mis:[M(nPr(10,m),'noRepeat',tx(`「${'1'.repeat(m)}」みたいに同じ数字をくり返してもいいよ → nʳ。`,`"${'1'.repeat(m)}" is allowed — digits can repeat → nʳ.`,`像“${'1'.repeat(m)}”这样重复也可以 → nʳ。`))],
  why:tx(`1けたごとに10通り、それを${m}回 → 10^${m} = ${10**m}`,`10 choices for each digit, ${m} times → 10^${m} = ${10**m}.`,`每一位10种，共${m}位 → 10^${m} = ${10**m}`)})},
],
c3:[
 {id:'c3a',sets:[[5,4],[4,5]],make:([b,g])=>({
  story:tx(`男子${b}人から2人、女子${g}人から1人、委員を選ぶよ。選び方は何通り?`,`Choose 2 of ${b} boys and 1 of ${g} girls for the class committee. How many ways?`,`从${b}个男生中选2人、${g}个女生中选1人当委员。有几种选法？`),
  sol:[ln(1,st('C',b,2,tx('男子から2人','2 boys','男生选2人')),st('N',g,0,tx('女子から1人','1 girl','女生选1人')))],
  brute:()=>product([combs(range(b),2),range(g)]).length,
  mis:[M(nCr(b,2)+g,'addForMul',tx(`男子2人「そして」女子1人。両方決めて委員が1組できる → かけ算。`,`2 boys AND 1 girl: you need both to make one committee → multiply.`,`男生2人“并且”女生1人：两样都选好才是一组委员 → 相乘。`)),
       M(nPr(b,2)*g,'PforC',tx(`男子の2人に順番はないよ。「はるとと そうた」と「そうたと はると」は同じ → C。`,`The 2 boys have no order: "Haru & Sota" = "Sota & Haru" → C.`,`两个男生没有顺序，“小春和小太”与“小太和小春”一样 → C。`)),
       M(nCr(b+g,3),'mix',tx(`男子と女子をまぜて3人選ぶと、女子2人の組も入っちゃう。グループごとに駅を作ろう。`,`Mixing everyone and picking 3 also counts teams with 2 girls. Make one station per group.`,`男女混在一起选3人，会把“2个女生”的组也算进去。每个小组单独设一个站。`))],
  why:tx(`男子から2人(順番なし → C)、そして女子から1人 → 一本道。${b}C2 × ${g} = ${nCr(b,2)} × ${g} = ${nCr(b,2)*g}`,`Pick 2 boys (no order → C), then 1 girl → one track. ${b}C2 × ${g} = ${nCr(b,2)} × ${g} = ${nCr(b,2)*g}.`,`男生选2人（无顺序 → C），再选1个女生 → 一条路。${b}C2 × ${g} = ${nCr(b,2)} × ${g} = ${nCr(b,2)*g}`)})},
 {id:'c3b',sets:[[6],[5]],make:([n])=>({
  story:tx(`${n}人の中から、委員長を1人と、ふつうの委員を2人選ぶよ。選び方は何通り?`,`From ${n} kids, choose 1 leader and 2 regular members. How many ways?`,`从${n}个人中选1个委员长和2个普通委员。有几种选法？`),
  sol:[ln(1,st('N',n,0,tx('委員長','leader','委员长')),st('C',n-1,2,tx('のこりから委員2人','2 members from the rest','从剩下的人选2个委员')))],
  brute:()=>range(n).flatMap(ch=>combs(range(n).filter(x=>x!==ch),2)).length,
  mis:[M(nPr(n,3),'PforC',tx(`ふつうの委員2人には順番がないよ。委員長だけが特別。`,`The 2 regular members have no order. Only the leader is special.`,`两个普通委员没有顺序，只有委员长是特别的。`)),
       M(nCr(n,3),'CforP',tx(`3人を選ぶだけだと、だれが委員長かが決まっていないね。`,`Picking 3 kids doesn't say who the leader is.`,`只选出3个人，还没决定谁是委员长。`))],
  why:tx(`まず委員長(${n}通り)、そしてのこり${n-1}人から委員2人(順番なし → C)。${n} × ${n-1}C2 = ${n*nCr(n-1,2)}`,`First the leader (${n} ways), then 2 of the other ${n-1} (no order → C). ${n} × ${n-1}C2 = ${n*nCr(n-1,2)}.`,`先选委员长（${n}种），再从剩下${n-1}人中选2个委员（无顺序 → C）。${n} × ${n-1}C2 = ${n*nCr(n-1,2)}`)})},
 {id:'c3c',sets:[[5,3],[4,2]],make:([k,n])=>({
  story:tx(`はがきが${k}しゅるい(どれも何まいでもある)。友だち${n}人に、それぞれ絵がちがうはがきを2まいずつ送るよ。送る順番は考えない。べつの友だちには同じ組み合わせを送ってもいい。送り方は何通り?`,`There are ${k} kinds of postcards (plenty of each). Each of ${n} friends gets 2 cards with different pictures (order doesn’t matter; two friends may get the same pair). How many ways?`,`明信片有${k}种（每种都很多）。给${n}个朋友每人寄两张图案不同的明信片（不考虑寄的顺序，不同朋友可以收到同样的组合）。有几种寄法？`),
  src:'Lovász 1.1',
  sol:[ln(1,...range(n).map(i=>st('C',k,2,tx(`${NM.ja[i]}の2まい`,`${NM.en[i]}'s 2 cards`,`${NM.zh[i]}的2张`))))],
  brute:()=>product(Array(n).fill(combs(range(k),2))).length,
  mis:[M(nCr(k,2)*n,'perPerson',tx(`${n}人それぞれに決めるから、駅が${n}こ並ぶ一本道。${nCr(k,2)}を${n}回かけるよ。`,`You decide for each of ${n} friends → ${n} stations in a row. Multiply ${nCr(k,2)} ${n} times.`,`要给${n}个人分别决定 → 一条路上有${n}个站，把${nCr(k,2)}乘${n}次。`)),
       M(nPr(k,2)**n,'PforC',tx(`1人がもらう2まいに順番はないよ(花と星 = 星と花) → C。`,`A friend's 2 cards have no order (flower+star = star+flower) → C.`,`一个人收到的两张没有顺序（花+星 = 星+花）→ C。`))],
  why:tx(`1人ぶんは ${k}C2 = ${nCr(k,2)}通り。それを${n}人ぶん続ける一本道 → ${nCr(k,2)}^${n} = ${nCr(k,2)**n}`,`One friend: ${k}C2 = ${nCr(k,2)} ways. Repeat for ${n} friends on one track → ${nCr(k,2)}^${n} = ${nCr(k,2)**n}.`,`一个人：${k}C2 = ${nCr(k,2)}种。${n}个人依次决定 → ${nCr(k,2)}^${n} = ${nCr(k,2)**n}`)})},
 {id:'c3d',sets:[[5,3],[6,2]],make:([n,r])=>({
  story:tx(`それぞれちがう${n}さつの本から${r}さつ選んで、本だなに左から1列にならべるよ。ならべ方は何通り?`,`Pick ${r} of ${n} different books and line them up on a shelf. How many ways?`,`从${n}本不同的书中选${r}本，在书架上从左到右排成一排。有几种排法？`),
  sol:[ln(1,st('C',n,r,tx(`${r}さつ選ぶ`,`pick ${r} books`,`选${r}本`)),st('P',r,r,tx('選んだ本をならべる','line them up','把选出的书排好')))],
  brute:()=>perms(range(n),r).length,
  mis:[M(nCr(n,r),'forgotOrder',tx(`選んだあと、本だなに「ならべる」のをわすれていない? ならべ方も駅にしよう。`,`After choosing, you still line them up. Add a station for the order.`,`选完以后还要“排”到书架上。别忘了加一个排列的站。`))],
  why:tx(`選んで(C)、そしてならべる(${r}P${r}) → ${n}C${r} × ${r}P${r} = ${nCr(n,r)} × ${fact(r)} = ${nPr(n,r)}。これは ${n}P${r} と同じ! P = C × ならべ方。`,`Choose (C), then arrange (${r}P${r}) → ${n}C${r} × ${r}P${r} = ${nCr(n,r)} × ${fact(r)} = ${nPr(n,r)}. Same as ${n}P${r}! P = C × arrangements.`,`先选（C），再排（${r}P${r}）→ ${n}C${r} × ${r}P${r} = ${nCr(n,r)} × ${fact(r)} = ${nPr(n,r)}。和 ${n}P${r} 一样！P = C × 排法。`)})},
 {id:'c3e',sets:[[4,3],[5,4]],make:([a,b])=>({
  story:tx(`赤玉${a}こ(みんなちがう番号つき)から2こ、白玉${b}こ(番号つき)から2こ取り出すよ。取り出す順番は考えないとき、取り出し方は何通り?`,`Take 2 of ${a} numbered red balls and 2 of ${b} numbered white balls (the order you take them out doesn’t matter). How many ways?`,`从${a}个编号红球中取2个、${b}个编号白球中取2个。不考虑取出的顺序，有几种取法？`),
  sol:[ln(1,st('C',a,2,tx('赤から2こ','2 red','红球取2个')),st('C',b,2,tx('白から2こ','2 white','白球取2个')))],
  brute:()=>product([combs(range(a),2),combs(range(b),2)]).length,
  mis:[M(nCr(a,2)+nCr(b,2),'addForMul',tx(`赤2こ「そして」白2こ。両方取って1回分 → かけ算。`,`2 red AND 2 white make one draw → multiply.`,`红2个“并且”白2个，合起来才是一次 → 相乘。`)),
       M(nCr(a+b,4),'mix',tx(`まぜて4こ取ると、赤3こ・白1こ なども入っちゃう。色ごとに駅を作ろう。`,`Mixing and taking 4 also counts 3 red + 1 white. One station per color.`,`混在一起取4个，会把“3红1白”也算进去。每种颜色单独设站。`))],
  why:tx(`赤から2こ(C)、そして白から2こ(C) → ${a}C2 × ${b}C2 = ${nCr(a,2)} × ${nCr(b,2)} = ${nCr(a,2)*nCr(b,2)}`,`2 red (C), then 2 white (C) → ${a}C2 × ${b}C2 = ${nCr(a,2)} × ${nCr(b,2)} = ${nCr(a,2)*nCr(b,2)}.`,`红球取2个（C），再白球取2个（C）→ ${a}C2 × ${b}C2 = ${nCr(a,2)} × ${nCr(b,2)} = ${nCr(a,2)*nCr(b,2)}`)})},
],
c4:[
 {id:'c4a',sets:[[4,3],[5,3]],make:([b,g])=>({
  story:tx(`男子${b}人・女子${g}人から2人選ぶよ。2人が同じ性別になる選び方は何通り?`,`From ${b} boys and ${g} girls choose 2 kids of the same gender. How many ways?`,`从${b}个男生和${g}个女生中选2人，要求2人性别相同。有几种选法？`),
  sol:[ln(1,st('C',b,2,tx('男子2人','2 boys','2个男生'))),ln(1,st('C',g,2,tx('女子2人','2 girls','2个女生')))],
  brute:()=>combs(range(b+g),2).filter(([x,y])=>(x<b)===(y<b)).length,
  mis:[M(nCr(b,2)*nCr(g,2),'mulForAdd',tx(`「男子2人」と「女子2人」は同時に起きないね(選ぶのは2人だけ)。分かれ道 → たし算。`,`"2 boys" and "2 girls" can't both happen — you only pick 2 kids. It's a fork → add.`,`“2个男生”和“2个女生”不会同时发生（一共只选2人）。是岔路 → 相加。`)),
       M(nCr(b+g,2),'noSplit',tx(`それだと男子1人・女子1人の組も入っちゃう。「男子ルート」と「女子ルート」に分けよう。`,`That also counts 1 boy + 1 girl. Split into a boys' route and a girls' route.`,`这样会把“1男1女”也算进去。分成“男生路线”和“女生路线”。`))],
  why:tx(`答えは「男子2人」か「女子2人」のどちらか → 分かれ道。${b}C2 + ${g}C2 = ${nCr(b,2)} + ${nCr(g,2)} = ${nCr(b,2)+nCr(g,2)}`,`Either 2 boys or 2 girls → a fork. ${b}C2 + ${g}C2 = ${nCr(b,2)} + ${nCr(g,2)} = ${nCr(b,2)+nCr(g,2)}.`,`要么2个男生，要么2个女生 → 岔路。${b}C2 + ${g}C2 = ${nCr(b,2)} + ${nCr(g,2)} = ${nCr(b,2)+nCr(g,2)}`)})},
 {id:'c4b',sets:[[3,5],[4,4]],make:([a,b])=>({
  story:tx(`アイス屋さんで、コーンかカップのどちらかを1つ注文するよ。コーンなら${a}つの味から1つ、カップなら${b}つの味からちがう2つ(順番なし)。注文のしかたは何通り?`,`Ice cream: you order exactly one — a cone or a cup. A cone gets 1 of ${a} flavors; a cup gets 2 different of ${b} flavors (no order). How many orders?`,`冰淇淋店：只点一份，甜筒或杯装。甜筒从${a}种口味选1种；杯装从${b}种口味选2种不同的（无顺序）。有几种点法？`),
  sol:[ln(1,st('N',a,0,tx('コーン','cone','甜筒'))),ln(1,st('C',b,2,tx('カップ','cup','杯装')))],
  brute:()=>a+combs(range(b),2).length,
  mis:[M(a*nCr(b,2),'mulForAdd',tx(`コーンとカップを「両方」買う? どちらか1つだけだよ → 分かれ道。`,`Do you buy a cone AND a cup? Just one of them → a fork.`,`你会甜筒和杯装都买吗？只买一种 → 岔路。`)),
       M(a+nPr(b,2),'PforC',tx(`カップの2つの味に順番はないよ(バニラ+いちご = いちご+バニラ) → C。`,`The two cup flavors have no order (vanilla+strawberry = strawberry+vanilla) → C.`,`杯装的两种口味没有顺序（香草+草莓 = 草莓+香草）→ C。`))],
  why:tx(`コーンかカップのどちらか → 分かれ道。コーン${a} + カップ ${b}C2(${nCr(b,2)}) = ${a+nCr(b,2)}`,`Cone OR cup → a fork. Cone ${a} + cup ${b}C2 (${nCr(b,2)}) = ${a+nCr(b,2)}.`,`甜筒或杯装 → 岔路。甜筒${a} + 杯装 ${b}C2（${nCr(b,2)}）= ${a+nCr(b,2)}`)})},
 {id:'c4c',sets:[[4],[5]],make:([b])=>({
  story:tx(`男子${b}人・女子3人から3人選ぶよ。女子が2人以上入る選び方は何通り?`,`From ${b} boys and 3 girls choose 3 kids with at least 2 girls. How many ways?`,`从${b}个男生和3个女生中选3人，要求至少有2个女生。有几种选法？`),
  sol:[ln(1,st('C',3,2,tx('女子2人','2 girls','2个女生')),st('N',b,0,tx('男子1人','1 boy','1个男生'))),ln(1,st('C',3,3,tx('女子3人','3 girls','3个女生')))],
  brute:()=>combs(range(b+3),3).filter(c=>c.filter(x=>x>=b).length>=2).length,
  mis:[M(3*(b+1),'overcount',tx(`「女子2人を先に選んで、のこり1人はだれでも」だと、女子3人の組が3回数えられてダブるよ。女子2人ルートと女子3人ルートに分けよう。`,`"Pick 2 girls, then anyone" counts the all-girl team 3 times. Split into a 2-girl route and a 3-girl route.`,`“先选2个女生，剩下1个随便”会把“3个都是女生”的组重复算3次。分成“2女”和“3女”两条路线。`)),
       M(3*b,'missCase',tx(`女子が3人になる場合をわすれていない? 「2人以上」は2人と3人。`,`Did you forget the 3-girl case? "At least 2" means 2 or 3.`,`是不是漏了3个女生的情况？“至少2个”包括2个和3个。`))],
  why:tx(`女子2人か3人のどちらか → 分かれ道。女子2人ルート: 3C2 × ${b} = ${3*b}、女子3人ルート: 3C3 = 1。合計 ${3*b+1}`,`2 girls OR 3 girls → a fork. 2-girl route: 3C2 × ${b} = ${3*b}; 3-girl route: 3C3 = 1. Total ${3*b+1}.`,`2个女生或3个女生 → 岔路。2女路线：3C2 × ${b} = ${3*b}；3女路线：3C3 = 1。合计 ${3*b+1}`)})},
 {id:'c4d',sets:[[4],[5]],make:([k])=>({
  story:tx(`0〜${k}のカード(1まいずつ)で3けたの[偶数|ぐうすう]を作るよ。何通り?`,`With cards 0–${k} (one of each), make 3-digit even numbers. How many?`,`用0〜${k}的卡片（每张一张）组成三位偶数。有几个？`),
  sol:[ln(1,st('N',1,0,tx('一の位が0','ones digit 0','个位是0')),st('P',k,2,tx('百・十の位','hundreds & tens','百位和十位'))),
       ln(1,st('N',2,0,tx('一の位が2か4','ones digit 2 or 4','个位是2或4')),st('N',k-1,0,tx('百の位(0以外)','hundreds (not 0)','百位（不能是0）')),st('N',k-1,0,tx('十の位','tens','十位')))],
  brute:()=>perms(range(k+1),3).filter(p=>p[0]!==0&&p[2]%2===0).length,
  mis:[M(3*k*(k-1),'noSplit',tx(`一の位が0かどうかで、百の位に置けるカードの数が変わるよ。そこで場合分けしよう。`,`Whether the ones digit is 0 changes how many cards fit in the hundreds place. Split there.`,`个位是不是0，会改变百位能放的卡片数。在这里分情况。`))],
  why:tx(`一の位が0のとき: のこり${k}まいから百・十をならべる ${k}P2 = ${nPr(k,2)}。一の位が2か4のとき: 2 × ${k-1} × ${k-1} = ${2*(k-1)*(k-1)}。分かれ道でたして ${nPr(k,2)+2*(k-1)*(k-1)}`,`Ones = 0: arrange hundreds & tens from the other ${k} cards, ${k}P2 = ${nPr(k,2)}. Ones = 2 or 4: 2 × ${k-1} × ${k-1} = ${2*(k-1)*(k-1)}. Add the routes: ${nPr(k,2)+2*(k-1)*(k-1)}.`,`个位是0：剩下${k}张排百位和十位，${k}P2 = ${nPr(k,2)}。个位是2或4：2 × ${k-1} × ${k-1} = ${2*(k-1)*(k-1)}。两条路线相加：${nPr(k,2)+2*(k-1)*(k-1)}`)})},
],
c5:[
 {id:'c5a',sets:[[4,3],[5,2]],make:([b,g])=>({
  story:tx(`男子${b}人・女子${g}人から3人選ぶよ。女子が少なくとも1人入る選び方は何通り?`,`From ${b} boys and ${g} girls choose 3 kids with at least one girl. How many ways?`,`从${b}个男生和${g}个女生中选3人，至少有1个女生。有几种选法？`),
  sol:[ln(1,st('C',b+g,3,tx('全員から3人','any 3 kids','从所有人选3人'))),ln(-1,st('C',b,3,tx('男子だけの3人','3 boys only','只有男生的3人')))],
  brute:()=>combs(range(b+g),3).filter(c=>c.some(x=>x>=b)).length,
  mis:[M(nCr(b+g,3),'forgotSub',tx(`それだと男子だけの組も入っているよ。「ひく道」で取りのぞこう。`,`That includes all-boy teams. Remove them with a minus route.`,`这样把“全是男生”的组也算进去了。用“减法路线”去掉。`)),
       M(g*nCr(b+g-1,2),'overcount',tx(`「女子を1人先に選んで、のこり2人は自由」だと、女子が2人いる組が2回数えられるよ(めいを先に選ぶ/りこを先に選ぶ)。`,`"Pick one girl first, then any 2" counts a team with two girls twice (Mei first, or Riko first).`,`“先选1个女生，剩下2个随便”会把有2个女生的组算两次（先选小美，或先选莉子）。`))],
  why:tx(`「少なくとも1人」= ぜんぶ − 1人もいない。${b+g}C3 − ${b}C3 = ${nCr(b+g,3)} − ${nCr(b,3)} = ${nCr(b+g,3)-nCr(b,3)}`,`"At least one" = all − none. ${b+g}C3 − ${b}C3 = ${nCr(b+g,3)} − ${nCr(b,3)} = ${nCr(b+g,3)-nCr(b,3)}.`,`“至少1个”= 全部 − 1个都没有。${b+g}C3 − ${b}C3 = ${nCr(b+g,3)} − ${nCr(b,3)} = ${nCr(b+g,3)-nCr(b,3)}`)})},
 {id:'c5b',sets:[[2],[3]],make:([m])=>({
  story:tx(`サイコロを${m}回ふるよ。少なくとも1回「6」が出る目の出方は何通り?`,`Roll a die ${m} times. In how many outcomes does at least one 6 appear?`,`掷骰子${m}次，至少出现一次“6”的结果有几种？`),
  sol:[ln(1,st('W',6,m,tx('ぜんぶの出方','all outcomes','全部结果'))),ln(-1,st('W',5,m,tx('6が1回も出ない','no 6 at all','一次6都没有')))],
  brute:()=>tuples(6,m).filter(t=>t.includes(5)).length,
  mis:[M(6**m,'forgotSub',tx(`それは「ぜんぶの出方」。6が1回も出ない出方をひこう。`,`That's all outcomes. Subtract the ones with no 6.`,`那是全部结果。还要减去一次6都没出的情况。`)),
       M(m*6**(m-1),'overcount',tx(`「1回目が6」「2回目が6」…とたすと、6が2回出た出方がダブるよ。ひき算の道がかんたん。`,`Adding "1st is 6", "2nd is 6"… counts double-6 outcomes twice. The minus route is easier.`,`把“第1次是6”“第2次是6”……相加，会把出两次6的情况重复算。用减法路线更简单。`))],
  why:tx(`ぜんぶ 6^${m} − 6が出ない 5^${m} = ${6**m} − ${5**m} = ${6**m-5**m}`,`All 6^${m} − no-six 5^${m} = ${6**m} − ${5**m} = ${6**m-5**m}.`,`全部 6^${m} − 没有6的 5^${m} = ${6**m} − ${5**m} = ${6**m-5**m}`)})},
 {id:'c5c',sets:[[3],[4]],make:([m])=>({
  story:tx(`0〜9で${m}けたの[暗証|あんしょう]番号(同じ数字OK・はじめが0でもOK)。同じ数字が2回以上出てくる番号は何通り?`,`A ${m}-digit PIN from 0–9 (repeats and a leading 0 allowed). How many PINs use some digit at least twice?`,`用0〜9组成${m}位密码（可重复，首位可以是0）。有数字出现2次以上的密码有几种？`),
  sol:[ln(1,st('W',10,m,tx('ぜんぶの番号','all PINs','全部密码'))),ln(-1,st('P',10,m,tx('ぜんぶちがう数字','all digits different','数字全都不同')))],
  brute:()=>tuples(10,m).filter(t=>new Set(t).size<m).length,
  mis:[M(10**m,'forgotSub',tx(`それは番号ぜんぶ。数字がぜんぶちがう番号をひこう。`,`That's every PIN. Subtract the ones where all digits differ.`,`那是全部密码。要减去数字全都不同的密码。`)),
       M(nPr(10,m),'flip',tx(`それは「ぜんぶちがう」番号の数。聞かれているのはその反対だよ。`,`That counts "all different". The question asks for the opposite.`,`那是“全都不同”的数量，题目问的是反面。`))],
  why:tx(`ぜんぶ 10^${m} − ぜんぶちがう 10P${m} = ${10**m} − ${nPr(10,m)} = ${10**m-nPr(10,m)}`,`All 10^${m} − all-different 10P${m} = ${10**m} − ${nPr(10,m)} = ${10**m-nPr(10,m)}.`,`全部 10^${m} − 全不同 10P${m} = ${10**m} − ${nPr(10,m)} = ${10**m-nPr(10,m)}`)})},
],
c6:[
 {id:'c6a',cell:'dA',sets:[[3,2],[4,3]],make:([k,n])=>({
  story:tx(`ちがう絵のはがき${k}まいを、友だち${n}人に配るよ。1人が何まいもらってもいいし、0まいでもいい。配り方は何通り?`,`Hand out ${k} different postcards to ${n} friends. Anyone may get any number, even zero. How many ways?`,`把${k}张不同的明信片分给${n}个朋友，每人几张都行，0张也行。有几种分法？`),
  src:'Lovász 1.2',
  sol:[ln(1,st('W',n,k,tx(`はがき${k}まいそれぞれ「だれに?」`,`"who gets it?" for each of ${k} cards`,`${k}张卡各自“给谁？”`)))],
  brute:()=>tuples(n,k).length,
  mis:[M(k**n,'powDir',tx(`はがき1まいずつ「だれにあげる?」と決めるよ。1回の選び方は${n}人、決める回数は${k}まい → ${n}^${k}。`,`For each card decide "who gets it?": ${n} choices, ${k} times → ${n}^${k}.`,`每张卡决定“给谁”：每次${n}种，决定${k}次 → ${n}^${k}。`))],
  why:tx(`はがきが主役。1まいごとに${n}通り、${k}まいぶん → ${n}^${k} = ${n**k}`,`The cards are the steps: ${n} choices each, ${k} cards → ${n}^${k} = ${n**k}.`,`以卡片为步骤：每张${n}种，共${k}张 → ${n}^${k} = ${n**k}`)})},
 {id:'c6b',cell:'dB',sets:[[3,5],[2,4]],make:([k,n])=>({
  story:tx(`ちがう絵のはがき${k}まいを、友だち${n}人に配るよ。1人1まいまで。配り方は何通り?`,`Hand out ${k} different postcards to ${n} friends, at most one each. How many ways?`,`把${k}张不同的明信片分给${n}个朋友，每人最多1张。有几种分法？`),
  sol:[ln(1,st('P',n,k,tx(`${k}まいを順に、まだもらっていない人へ`,`each card to someone new`,`每张依次给还没拿到的人`)))],
  brute:()=>perms(range(n),k).length,
  mis:[M(nCr(n,k),'CforP',tx(`はがきは絵がちがうから、だれがどれをもらうかで区別がある → P。`,`The cards differ, so who gets which matters → P.`,`卡片各不相同，谁拿哪张有区别 → P。`)),
       M(n**k,'repeat',tx(`1人1まいまで。もらった人には、もうあげられないよ。`,`At most one each — someone who has a card can't get another.`,`每人最多1张，拿过的人不能再拿。`))],
  why:tx(`1まい目は${n}人、2まい目は${n-1}人…同じ人はダメ、はがきに区別あり → ${n}P${k} = ${nPr(n,k)}`,`First card: ${n} people, next: ${n-1}… no repeats, cards differ → ${n}P${k} = ${nPr(n,k)}.`,`第1张${n}人可选、第2张${n-1}人……不能重复、卡片有区别 → ${n}P${k} = ${nPr(n,k)}`)})},
 {id:'c6c',cell:'dC',star:true,sets:[[4,3]],make:([k,n])=>({
  story:tx(`⭐チャレンジ: ちがう絵のはがき${k}まいを、友だち${n}人に配るよ。みんな1まい以上もらう。配り方は何通り?`,`⭐Challenge: hand out ${k} different postcards to ${n} friends so that everyone gets at least one. How many ways?`,`⭐挑战：把${k}张不同的明信片分给${n}个朋友，每人至少1张。有几种分法？`),
  src:'Lovász 1.2',
  sol:[ln(1,st('C',4,2,tx('2まいセットにする2まい','the 2 cards that go together','凑成一组的2张')),st('P',3,3,tx('3つのたばを3人に','3 bundles to 3 friends','3叠分给3人')))],
  brute:()=>tuples(n,k).filter(t=>new Set(t).size===n).length,
  mis:[M(n**k,'forgotSub',tx(`それだと0まいの人がいる配り方も入っているよ。`,`That includes ways where someone gets nothing.`,`这样把有人拿0张的分法也算进去了。`)),
       M(nCr(4,2)*3,'forgotOrder',tx(`たばを作ったら、3つのたばを3人にわたすならべ方(3P3)もあるよ。`,`After making the bundles, the 3 bundles can go to the 3 friends in 3P3 ways.`,`凑成3叠以后，把3叠分给3个人还有 3P3 种。`))],
  why:tx(`4まいを3人で全員1まい以上 → だれか1人が2まい。まず2まいセットを選ぶ 4C2 = 6、そして3つのたばを3人に 3P3 = 6 → 36`,`4 cards, 3 friends, everyone ≥1 → someone gets 2. Choose that pair 4C2 = 6, then give the 3 bundles out 3P3 = 6 → 36.`,`4张给3人且每人至少1张 → 有一人拿2张。先选这2张 4C2 = 6，再把3叠分给3人 3P3 = 6 → 36`)})},
 {id:'c6d',cell:'iA',sets:[[5,3],[4,2]],make:([k,n])=>({
  story:tx(`同じ10円玉${k}まいを、${n}人に配るよ。0まいの人がいてもいい。配り方は何通り?`,`Hand out ${k} identical 10-yen coins to ${n} people. Someone may get none. How many ways?`,`把${k}枚一样的10日元硬币分给${n}个人，可以有人拿0枚。有几种分法？`),
  src:'Lovász 1.4(b)',
  sol:[ln(1,st('C',k+n-1,n-1,tx(`${k+n-1}か所から[仕切|しき]り${n-1}本の場所`,`places for ${n-1} dividers among ${k+n-1}`,`${k+n-1}个位置里放${n-1}块隔板`)))],
  brute:()=>compositions(k,n,0),
  mis:[M(n**k,'distinct',tx(`10円玉には区別がないよ。大事なのは「だれが何まい」だけ。`,`The coins are identical. Only "how many each person gets" matters.`,`硬币没有区别，只看“每人拿几枚”。`)),
       M(nCr(k-1,n-1),'stars',tx(`それは「みんな1まい以上」のとき。0まいOKなら、コイン${k}まいと[仕切|しき]り${n-1}本を1列にならべて考えよう。`,`That's the "everyone ≥1" count. With zeros allowed, line up ${k} coins and ${n-1} dividers.`,`那是“每人至少1枚”的情况。允许0枚时，把${k}枚硬币和${n-1}块隔板排成一排来想。`))],
  why:tx(`${coinPic(k,n)} のように、コイン${k}まいと[仕切|しき]り${n-1}本をならべる。${k+n-1}か所のうち[仕切|しき]りの場所を選ぶ → ${k+n-1}C${n-1} = ${nCr(k+n-1,n-1)}`,`Like ${coinPic(k,n)}: line up ${k} coins and ${n-1} dividers; choose the divider spots among ${k+n-1} → ${k+n-1}C${n-1} = ${nCr(k+n-1,n-1)}.`,`像 ${coinPic(k,n)}：把${k}枚硬币和${n-1}块隔板排一排，在${k+n-1}个位置里选隔板的位置 → ${k+n-1}C${n-1} = ${nCr(k+n-1,n-1)}`)})},
 {id:'c6e',cell:'iB',sets:[[3,5],[2,4]],make:([k,n])=>({
  story:tx(`同じあめ${k}こを、${n}人に配るよ。1人1こまで。配り方は何通り?`,`Hand out ${k} identical candies to ${n} kids, at most one each. How many ways?`,`把${k}颗一样的糖分给${n}个人，每人最多1颗。有几种分法？`),
  sol:[ln(1,st('C',n,k,tx(`あめをもらう${k}人`,`the ${k} kids who get one`,`拿到糖的${k}个人`)))],
  brute:()=>combs(range(n),k).length,
  mis:[M(nPr(n,k),'PforC',tx(`あめはみんな同じ。だれがもらうか、だけが大事 → C。`,`The candies are identical; only who gets one matters → C.`,`糖都一样，只看谁拿到 → C。`)),
       M(nCr(k+n-1,n-1),'stars',tx(`1人1こまでだから、[仕切|しき]りはいらない。もらう人を選ぶだけ。`,`At most one each, so no dividers — just choose who gets one.`,`每人最多1颗，用不着隔板，选出拿糖的人就行。`))],
  why:tx(`同じものを1人1こまで → もらう人を選ぶだけ。${n}C${k} = ${nCr(n,k)}`,`Identical items, at most one each → just choose the receivers. ${n}C${k} = ${nCr(n,k)}.`,`相同的东西、每人最多1个 → 选出拿到的人就行。${n}C${k} = ${nCr(n,k)}`)})},
 {id:'c6f',cell:'iC',sets:[[7,3],[6,3]],make:([k,n])=>({
  story:tx(`同じ10円玉${k}まいを、${n}人に配るよ。みんな1まい以上。配り方は何通り?`,`Hand out ${k} identical 10-yen coins to ${n} people, everyone at least one. How many ways?`,`把${k}枚一样的10日元硬币分给${n}个人，每人至少1枚。有几种分法？`),
  src:'Lovász 1.4(a)',
  sol:[ln(1,st('C',k-1,n-1,tx(`すきま${k-1}か所に[仕切|しき]り${n-1}本`,`${n-1} dividers in ${k-1} gaps`,`${k-1}个空隙里放${n-1}块隔板`)))],
  brute:()=>compositions(k,n,1),
  mis:[M(n**k,'distinct',tx(`10円玉には区別がないよ。大事なのは「だれが何まい」だけ。`,`The coins are identical. Only "how many each" matters.`,`硬币没有区别，只看“每人几枚”。`)),
       M(nCr(k,n-1),'stars',tx(`[仕切|しき]りを入れるのは、コインとコインの「すきま」(${k-1}か所)だよ。はしに入れると0まいの人ができちゃう。`,`Dividers go in the gaps between coins (${k-1} gaps). A divider at the end would leave someone with zero.`,`隔板放在硬币之间的空隙（${k-1}个）。放在两端就会有人拿0枚。`)),
       M(nPr(k-1,n-1),'PforC',tx(`[仕切|しき]りはみんな同じだから、場所を選ぶだけ → C。`,`Dividers are identical, so just choose their places → C.`,`隔板都一样，只要选位置 → C。`))],
  why:tx(`${coinPic(k,n)} のように、${k}まいの間のすきま${k-1}か所から[仕切|しき]り${n-1}本の場所を選ぶ → ${k-1}C${n-1} = ${nCr(k-1,n-1)}`,`Like ${coinPic(k,n)}: choose ${n-1} of the ${k-1} gaps between coins → ${k-1}C${n-1} = ${nCr(k-1,n-1)}.`,`像 ${coinPic(k,n)}：在${k}枚硬币之间的${k-1}个空隙里选${n-1}个放隔板 → ${k-1}C${n-1} = ${nCr(k-1,n-1)}`)})},
],
c7:[
 {id:'c7a',sets:[[5],[4]],make:([n])=>({
  story:tx(`${n}人が1列に並ぶよ。あおいとゆいは、となりどうし。ならび方は何通り?`,`${n} kids line up. Aoi and Yui stand next to each other. How many lineups?`,`${n}个人排成一排，小葵和小唯要挨着。有几种排法？`),
  src:tx('21のわざ #1 まとめる','21 methods #1 bundling (捆绑法)','21种解法 #1 相邻问题捆绑法'),
  sol:[ln(1,st('P',n-1,n-1,tx('2人を1つにまとめてならべる','line up with the pair as one','把两人捆成一个来排')),st('P',2,2,tx('まとめた中の2人','inside the pair','捆内两人')))],
  brute:()=>perms(range(n)).filter(p=>Math.abs(p.indexOf(0)-p.indexOf(1))===1).length,
  mis:[M(fact(n-1),'forgotInner',tx(`まとめた中にも「あおい・ゆい」「ゆい・あおい」の2通りがあるよ。`,`Inside the pair there are 2 orders: Aoi–Yui and Yui–Aoi.`,`捆在一起的两人内部还有“葵唯”“唯葵”2种。`)),
       M(fact(n),'noRule',tx(`それだと、となりじゃないならび方も入っているよ。2人をまとめて1人と考えよう。`,`That includes lineups where they're apart. Treat the pair as one person.`,`这样把不挨着的排法也算进去了。把两人当成一个人。`))],
  why:tx(`2人をまとめて1人と考えると${n-1}人のならび ${n-1}P${n-1} = ${fact(n-1)}、そして中の2人 2P2 = 2 → ${fact(n-1)*2}`,`Treat the pair as one: ${n-1} items, ${n-1}P${n-1} = ${fact(n-1)}; then the pair's inside order 2P2 = 2 → ${fact(n-1)*2}.`,`把两人捆成一个：${n-1}个排 ${n-1}P${n-1} = ${fact(n-1)}；再乘捆内 2P2 = 2 → ${fact(n-1)*2}`)})},
 {id:'c7b',sets:[[3],[4]],make:([a])=>({
  story:tx(`大人${a}人と子ども2人が1列に並ぶよ。子どもどうしは、となりにならない。ならび方は何通り?`,`${a} adults and 2 children line up. The children may not stand next to each other. How many lineups?`,`${a}个大人和2个小孩排成一排，两个小孩不能挨着。有几种排法？`),
  src:tx('21のわざ #2 すきまに入れる','21 methods #2 gaps (插空法)','21种解法 #2 相离问题插空排'),
  sol:[ln(1,st('P',a,a,tx('大人を先にならべる','line up adults first','先排大人')),st('P',a+1,2,tx(`すきま${a+1}か所に子ども`,`children into ${a+1} gaps`,`小孩插进${a+1}个空`)))],
  brute:()=>perms(range(a+2)).filter(p=>Math.abs(p.indexOf(a)-p.indexOf(a+1))!==1).length,
  mis:[M(fact(a)*nCr(a+1,2),'PforC',tx(`子ども2人はちがう人。どちらがどのすきまに入るかで区別があるよ → P。`,`The two children are different people — which gap each takes matters → P.`,`两个小孩是不同的人，谁进哪个空有区别 → P。`)),
       M(fact(a+2),'noRule',tx(`それだと子どもがとなりのならび方も入っているよ。大人を先にならべて、すきまに子どもを入れよう。`,`That includes lineups with the kids together. Seat the adults, then put kids into gaps.`,`这样把小孩挨着的也算进去了。先排大人，再把小孩插进空隙。`))],
  why:tx(`大人をならべて ${a}P${a} = ${fact(a)}。大人の間と両はしのすきまは${a+1}か所。そこに子ども2人を入れる ${a+1}P2 = ${nPr(a+1,2)} → ${fact(a)*nPr(a+1,2)}`,`Line up the adults ${a}P${a} = ${fact(a)}. There are ${a+1} gaps (between and at the ends). Put the 2 kids in: ${a+1}P2 = ${nPr(a+1,2)} → ${fact(a)*nPr(a+1,2)}.`,`先排大人 ${a}P${a} = ${fact(a)}。大人之间加两端共${a+1}个空，插入2个小孩 ${a+1}P2 = ${nPr(a+1,2)} → ${fact(a)*nPr(a+1,2)}`)})},
 {id:'c7c',sets:[[5],[4]],make:([n])=>({
  story:tx(`${n}人が1列に並ぶよ。あおいは、ゆいより左にいる(となりでなくてもいい)。ならび方は何通り?`,`${n} kids line up, with Aoi somewhere to the left of Yui. How many lineups?`,`${n}个人排成一排，小葵要在小唯左边（不一定挨着）。有几种排法？`),
  src:tx('21のわざ #3 順番が決まっている','21 methods #3 fixed order (定序缩倍法)','21种解法 #3 定序问题缩倍法'),
  sol:[ln(1,st('C',n,2,tx('2人が立つ場所','the 2 spots for them','两人站的位置')),st('P',n-2,n-2,tx('ほかの人','everyone else','其他人')))],
  brute:()=>perms(range(n)).filter(p=>p.indexOf(0)<p.indexOf(1)).length,
  mis:[M(fact(n),'forgotOrderFixed',tx(`あおいとゆいの順番は決まっているよ。2人の場所を選んだら、どちらが左かは1通り。`,`Aoi and Yui's order is fixed. Once you choose their 2 spots, there's only one way to place them.`,`小葵和小唯的先后是定好的。选好两个位置后，谁在左边只有1种。`))],
  why:tx(`2人が立つ場所を選ぶ ${n}C2 = ${nCr(n,2)}(左があおいで決まり)、そしてほかの${n-2}人 → ${nCr(n,2)} × ${fact(n-2)} = ${nCr(n,2)*fact(n-2)}。${n}P${n}÷2 と同じ!`,`Choose the 2 spots ${n}C2 = ${nCr(n,2)} (Aoi takes the left one), then the other ${n-2} → ${nCr(n,2)} × ${fact(n-2)} = ${nCr(n,2)*fact(n-2)}. Same as ${n}P${n} ÷ 2!`,`先选两人的位置 ${n}C2 = ${nCr(n,2)}（左边自然是小葵），再排其余${n-2}人 → ${nCr(n,2)} × ${fact(n-2)} = ${nCr(n,2)*fact(n-2)}。和 ${n}P${n}÷2 一样！`)})},
 {id:'c7d',sets:[[4],[5]],make:([k])=>({

function registerWorld(w){(w.chapters||[]).forEach(c=>{c.world=w.id;PROBLEMS[c.id]=c.problems||[];ALLCH.push(c)});
  Object.assign(MOVES,w.moves||{});Object.assign(SPECIES,w.species||{});Object.assign(TAGS,w.tags||{});WORLDS.push(w)}
function chById(id){return ALLCH.find(c=>c.id===id)}
function worldOf(ch){return WORLDS.find(w=>w.id===ch.world)}
function worldOpen(w){return S.unlockAll||!w.after||!!S.cleared[w.after]}
function chOpen(ch){const w=worldOf(ch);if(!worldOpen(w))return false;if(w.free)return true;const i=w.chapters.indexOf(ch);return S.unlockAll||i===0||!!S.cleared[w.chapters[i-1].id]}

const KEY='kazoe-island-v2';

window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{const ns=JSON.parse(e.newValue);const core=o=>{const c={...o};delete c.usage;return JSON.stringify(c)};if(core(ns)===core(S)){S.usage=ns.usage;return}   // only minutes changed: don't redraw (would wipe a half-typed answer)
  Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,ns);LEARN_INIT();if(HOOK.reset)HOOK.reset();renderTop();rerender()}catch(err){}});

// ---------- text helpers ----------
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rich(s,v){
  s=s.replace(/\{(\w+)\}/g,(m,k)=>v&&v[k]!==undefined?v[k]:(k==='name'?esc(S.name||L.nameDef[LANG]):m));
  s=s.replace(/\[([^\]|]+)\|([^\]]+)\]/g,LANG==='ja'?'<ruby>$1<rt>$2</rt></ruby>':'$1');
  s=s.replace(/(\d+)([PC])(\d+)/g,'<sub>$1</sub>$2<sub>$3</sub>').replace(/(\d+)\^(\d+)/g,'$1<sup>$2</sup>');
  s=s.replace(/(^|[^\w./])(\d+)\/(\d+)(?![\w/])/g,(m,pre,a,b)=>pre+`<span class="fr"><span>${a}</span><span>${b}</span></span>`);
  return s}
function T(o,v){if(o==null)return '';if(typeof o==='string')return rich(o,v);return rich(o[LANG]??o.en,v)}
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

// ---------- sound & confetti ----------
let AC;
function snd(type){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const seq={ok:[660,880,1175],pop:[600],soft:[392,330],done:[523,659,784,1046],step:[740]}[type]||[600];
  seq.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;const t=AC.currentTime+i*.09;
   g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.32)})}catch(e){}}
function confetti(){if(REDUCED)return;const c=document.createElement('div');c.className='confetti';const cols=['#ffc94d','#ff6f91','#8b6fd6','#2fb0c6','#7dc26a','#ff8f45'];
  for(let i=0;i<46;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=cols[i%cols.length];e.style.animationDelay=(Math.random()*.5)+'s';e.style.animationDuration=(1.4+Math.random()*.9)+'s';c.appendChild(e)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),2800)}

function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;const cl=x=>Math.max(0,Math.min(255,x));return '#'+((1<<24)+(cl(r)<<16)+(cl(g)<<8)+cl(b)).toString(16).slice(1)}
function critter(id,size=72,opt={}){
  const sp=SPECIES[id];if(!sp)return '';const b=sp.c,d=sp.d||shade(b,-40),pk='#ffbccb',ink='#3b3346';const sw=2.6;

  switch(sp.ear){
   case 'round':back=`<circle cx="25" cy="34" r="12" fill="${b}" stroke="${d}" stroke-width="${sw}"/><circle cx="75" cy="34" r="12" fill="${b}" stroke="${d}" stroke-width="${sw}"/><circle cx="25" cy="34" r="5.5" fill="${pk}"/><circle cx="75" cy="34" r="5.5" fill="${pk}"/>`;break;
   case 'cat':back=`<path d="M18 46 L23 12 L45 30 Z" fill="${b}" stroke="${d}" stroke-width="${sw}" stroke-linejoin="round"/><path d="M82 46 L77 12 L55 30 Z" fill="${b}" stroke="${d}" stroke-width="${sw}" stroke-linejoin="round"/><path d="M25 36 L27 21 L37 30Z" fill="${pk}"/><path d="M75 36 L73 21 L63 30Z" fill="${pk}"/>`;break;
   case 'bunny':back=`<ellipse cx="36" cy="20" rx="8.5" ry="20" transform="rotate(-12 36 20)" fill="${b}" stroke="${d}" stroke-width="${sw}"/><ellipse cx="64" cy="20" rx="8.5" ry="20" transform="rotate(12 64 20)" fill="${b}" stroke="${d}" stroke-width="${sw}"/><ellipse cx="36" cy="22" rx="3.6" ry="13" transform="rotate(-12 36 22)" fill="${pk}"/><ellipse cx="64" cy="22" rx="3.6" ry="13" transform="rotate(12 64 22)" fill="${pk}"/>`;break;
   case 'fox':back=`<path d="M14 50 L20 6 L48 30 Z" fill="${b}" stroke="${d}" stroke-width="${sw}" stroke-linejoin="round"/><path d="M86 50 L80 6 L52 30 Z" fill="${b}" stroke="${d}" stroke-width="${sw}" stroke-linejoin="round"/><path d="M20 6 L24 22 L30 16Z" fill="#fff"/><path d="M80 6 L76 22 L70 16Z" fill="#fff"/>`;break;
   case 'horn':back=`<path d="M34 34 L38 12 L46 31Z" fill="#fff3c4" stroke="${d}" stroke-width="2" stroke-linejoin="round"/><path d="M66 34 L62 12 L54 31Z" fill="#fff3c4" stroke="${d}" stroke-width="2" stroke-linejoin="round"/>`;break;
   case 'fin':back=`<path d="M40 34 Q50 2 64 30 Z" fill="${d}" stroke="${d}" stroke-width="2" stroke-linejoin="round"/>`;break;

   case 'sprout':front=`<path d="M50 32 Q49 20 50 13" stroke="#4c9a3f" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M50 17 Q37 4 28 12 Q39 23 50 17Z" fill="#7cc95b" stroke="#4c9a3f" stroke-width="1.6"/><path d="M50 15 Q63 2 72 9 Q61 21 50 15Z" fill="#8fd96b" stroke="#4c9a3f" stroke-width="1.6"/>`;break;
   case 'crest':front=`<ellipse cx="44" cy="20" rx="4.5" ry="11" transform="rotate(-20 44 20)" fill="#ff9f43"/><ellipse cx="50" cy="16" rx="4.5" ry="13" fill="#ffb347"/><ellipse cx="56" cy="20" rx="4.5" ry="11" transform="rotate(20 56 20)" fill="#ff9f43"/>`;break;
   case 'star':front=`<path d="M50 31 L50 15" stroke="${d}" stroke-width="3" stroke-linecap="round"/><path d="M50 3 L53.5 10 L61 11 L55.5 16 L57 23.5 L50 20 L43 23.5 L44.5 16 L39 11 L46.5 10Z" fill="#ffd84d" stroke="#e3a82a" stroke-width="1.5" stroke-linejoin="round"/>`;break;
   case 'drop':front=`<path d="M50 6 Q62 22 59 29 Q50 38 41 29 Q38 22 50 6Z" fill="${shade(b,30)}" stroke="${d}" stroke-width="2"/>`;break;
  }
  const ex=typeof critterExtra==='function'?critterExtra(sp):{back:'',body:null,dy:0,pat:'',top:''};
  if(ex.dy){back=`<g transform="translate(0 ${ex.dy})">${back}</g>`;front=`<g transform="translate(0 ${ex.dy})">${front}</g>`}
  const happy=opt.happy;
  const eyes=!happy&&sp.eyes==='sleepy'?`<path d="M32 57 Q38 61 44 57" stroke="${ink}" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M56 57 Q62 61 68 57" stroke="${ink}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`:happy?`<path d="M32 58 Q38 51 44 58" stroke="${ink}" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M56 58 Q62 51 68 58" stroke="${ink}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`

   ${opt.stage>=2?`<path d="M22 73 Q50 87 78 73 L77 80 Q50 94 23 80Z" fill="#e0566f" stroke="#a83246" stroke-width="1.5"/><path d="M64 82 L74 97 L60 90Z" fill="#e0566f" stroke="#a83246" stroke-width="1.5"/>`:''}
   ${opt.stage>=3?`<path d="M36 27 L40 12 L50 22 L60 12 L64 27Z" fill="#ffd84d" stroke="#e3a82a" stroke-width="2" stroke-linejoin="round"/><circle cx="50" cy="20" r="2.6" fill="#ff6f91"/><path d="M88 22 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3Z" fill="#ffd84d"/><path d="M10 40 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2Z" fill="#ffd84d"/>`:''}${typeof critterAcc==='function'&&!opt.noAcc?critterAcc(typeof wearOf==='function'?wearOf(id):(id===S.buddy?S.wear:null)):''}</svg>`}

  if(s.t==='P')return r===0?'1':seq(r);if(s.t==='C')return r===0?'1':`${seq(r)}÷${r}!`;return r>4?`${n}×${n}×…`:Array(r).fill(n).join('×')||'1'}

     <div class="track">${l.st.map((s,si)=>(si?'<span class="times">×</span>':'')+stnHTML(s,ed?`data-s="${li}-${si}"`:'tabindex="-1"',{sel:ed&&opt.sel===li+'-'+si,lab:opt.lab})).join('')}

   <div class="board-list">${w.chapters.map((c,i)=>{const lk=!chOpen(c),dn=S.cleared[c.id];const p=S.prog[c.id]||0,n=PROBLEMS[c.id].length;

function openChapter(id){const ch=chById(id);if(ch.onOpen)ch.onOpen();const w=worldOf(ch);const i=w.chapters.indexOf(ch);CUR={ch,i,mode:'lesson',li:0,pi:Math.min(S.prog[ch.id]||0,PROBLEMS[ch.id].length-1)};

  renderChapter()}
function chapterShell(inner,sayLines){const ch=CUR.ch;const n=PROBLEMS[ch.id].length;
  const dots=range(n).map(k=>`<i class="${k<(S.prog[ch.id]||0)||S.cleared[ch.id]?'on':''} ${CUR.mode==='prob'&&k===CUR.pi?'cur':''}"></i>`).join('');

let SAYQ=[];
// dialogue appears letter by letter with soft random-pitch blips; tap ▶ to finish a line
let TYPER=null;
function blip(){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type='square';o.frequency.value=380+Math.random()*260;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.035,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.05);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.06)}catch(e){}}
function typeLine(el,html){if(TYPER){TYPER.finish();TYPER=null}if(!el)return;el.innerHTML=html||'';if(REDUCED||!html)return;
  const spans=[];const walk=n=>{for(const c of [...n.childNodes]){if(c.nodeType===3){const f=document.createDocumentFragment();for(const ch of c.textContent){const sp=document.createElement('span');sp.className='tch';sp.textContent=ch;f.appendChild(sp);spans.push(sp)}c.replaceWith(f)}else if(c.nodeType===1)walk(c)}};walk(el);
  let i=0;const me={busy:true,finish(){clearInterval(tk);spans.forEach(s=>s.classList.add('on'));me.busy=false;if(TYPER===me)TYPER=null}};
  const tk=setInterval(()=>{if(!el.isConnected||i>=spans.length){me.finish();return}spans[i].classList.add('on');if(i%2===0&&spans[i].textContent.trim())blip();i++},26);TYPER=me;
  el.addEventListener('click',()=>me.finish(),{once:true})}
function say(lines){SAYQ=[...(lines||[])];const nx=$('#nx');const show=()=>{const l=SAYQ.shift();typeLine($('#say'),l?T(l):'');nx.hidden=!SAYQ.length};nx.onclick=()=>{if(TYPER&&TYPER.busy){TYPER.finish();return}snd('step');show()};show()}
function sayNow(t){SAYQ=[];const s=$('#say');if(s)typeLine(s,t);const nx=$('#nx');if(nx)nx.hidden=true}
function renderChapter(){rerender=renderChapter;const ch=CUR.ch;
  if(CUR.mode==='lesson'){const keys=ch.lessons;const k=keys[CUR.li];const les=typeof k==='string'?{h:LESSONS[k]}:k;
    chapterShell(`<div class="panel lesson"><span class="muted" style="font-weight:800">${T(L.lessonHead)} ${CUR.li+1} / ${keys.length}</span>${les.h()}<div class="row" style="justify-content:flex-end">${CUR.li>0?`<button class="btn ghost" id="lp" type="button">←</button>`:''}<button class="btn" id="ln" type="button">${T(L.next)}</button></div></div>`,CUR.li===0?ch.say:[]);
    $('#ln').onclick=()=>{snd('step');if(CUR.li<keys.length-1){CUR.li++;renderChapter()}else{S.seen[ch.id]=1;save();CUR.mode='prob';renderChapter()}};
    const lp=$('#lp');if(lp)lp.onclick=()=>{CUR.li--;renderChapter()};if(les.m)les.m($('#stage .lesson'));return}
  const p=ch.live?ch.live(CUR.pi):getProblem(ch.id,CUR.pi,0);
  runTask(p,{shell:true,onDone:()=>{const done=Math.max(S.prog[ch.id]||0,CUR.pi+1);S.prog[ch.id]=done;save();
    if(CUR.pi<PROBLEMS[ch.id].length-1){CUR.pi++;renderChapter()}else clearChapter()}})}
function clearChapter(){const ch=CUR.ch;const first=!S.cleared[ch.id];S.cleared[ch.id]=1;save();snd('done');confetti();
  modal(`<h2>${T(L.clearHead,{place:T(ch.place)})}</h2><div class="parade">${ch.unlock.map(k=>critter(k,70,{happy:true})).join('')}</div>

   ${ch.id==='c6'?`<div class="why" style="text-align:left">📚 ${LANGTXT('おまけ: 大学の本(Lovász『組合せ論の問題と演習』)の問題 — CHARACTERIZATION の文字をならべかえる方法は 16!÷(3!·2!·2!·2!·2!) = <b>217,945,728,000</b> 通り。きみが習った「場所を選ぶ」わざで解けるよ!','Bonus from a university book (Lovász, <i>Combinatorial Problems and Exercises</i> 1.3): CHARACTERIZATION can be rearranged in 16!÷(3!·2!·2!·2!·2!) = <b>217,945,728,000</b> ways — the same "choose the spots" move you just learned!','彩蛋：大学教材（Lovász《组合问题与练习》1.3）——CHARACTERIZATION 的字母重新排列有 16!÷(3!·2!·2!·2!·2!) = <b>217,945,728,000</b> 种，用的正是你刚学的“选位置”绝招！')}</div>`:''}
   <p class="muted" style="margin:0">${T(L.stopOk)}</p>`,[{t:T(L.map),fn:backFromChapter}]);

// ---------- problem runner (builder + judge) ----------
function runProblem(p,opt){
  const at=attemptOf(p,opt.ctx);let lanes=at.lanes||[ln(1,st(null,3,2))];at.lanes=lanes;let sel=at.lanes.some(l=>l.st.some(x=>x.t))?null:'0-0';let solved=false;
  const total=opt.total||PROBLEMS[p.ch].length, idx=opt.index??p.idx;

  const html=`${head}<div id="board"></div><div id="editor"></div>
    <div class="row"><button class="btn berry" id="run" type="button">${T(L.run)}</button><button class="btn ghost" id="hintb" type="button">💡 ${T(L.hint)}</button><span class="sp" style="flex:1"></span><span id="buddy">${critter(S.buddy,52,{stage:typeof buddyStage==='function'?buddyStage():1})}</span></div><div id="fb"></div>`;

  const draw=()=>{at.lanes=lanes;const ae=document.activeElement,fk=ae&&ae.dataset?(ae.dataset.d?`[data-d="${ae.dataset.d}"]`:ae.dataset.t?`[data-t="${ae.dataset.t}"]`:null):null;
    $('#board').innerHTML=boardHTML(lanes,{edit:!solved,sel,counts:lanes.map(()=>''),goal:'🎉'});bindBoard();drawEditor();if(fk){const f=$('#editor '+fk);if(f)f.focus()}};
  function bindBoard(){const b=$('#board');
    $$('[data-s]',b).forEach(e=>e.onclick=()=>{sel=e.dataset.s;snd('pop');draw()});
    $$('[data-add]',b).forEach(e=>e.onclick=()=>{const li=+e.dataset.add;lanes[li].st.push(st(null,3,2));sel=li+'-'+(lanes[li].st.length-1);snd('pop');draw()});
    $$('[data-addlane]',b).forEach(e=>e.onclick=()=>{lanes.push(ln(1,st(null,3,2)));sel=(lanes.length-1)+'-0';snd('pop');draw()});
    $$('[data-del]',b).forEach(e=>e.onclick=()=>{lanes.splice(+e.dataset.del,1);sel=null;draw()});
    $$('[data-sign]',b).forEach(e=>e.onclick=()=>{const l=lanes[+e.dataset.sign];l.sign=-l.sign;snd('pop');draw()});}
  function drawEditor(){const ed=$('#editor');if(!sel||solved){ed.innerHTML='';return}const [li,si]=sel.split('-').map(Number);const s=lanes[li]?.st[si];if(!s){ed.innerHTML='';return}
    const t=s.t;const nl=t==='W'?L.nEach:t==='N'?L.nWays:L.nAll, rl=t==='W'?L.rTimes:L.rPick;
    ed.innerHTML=`<div class="editor"><div class="types">${['N','P','C','W'].map(k=>`<button class="tbtn ${k} ${t===k?'on':''}" data-t="${k}" type="button"><span class="k">${k==='N'?'n':k==='W'?'nʳ':k}</span><small>${T(L['t'+k])}</small></button>`).join('')}</div>
     ${t?`<div class="steppers"><div class="stepper"><span class="lbl">${T(nl)}</span><button data-d="n-" type="button" aria-label="${T(nl).replace(/<[^>]+>/g,'')} −">−</button><span class="v">${s.n}</span><button data-d="n+" type="button" aria-label="${T(nl).replace(/<[^>]+>/g,'')} ＋">＋</button></div>
     ${t!=='N'?`<div class="stepper"><span class="lbl">${T(rl)}</span><button data-d="r-" type="button" aria-label="${T(rl).replace(/<[^>]+>/g,'')} −">−</button><span class="v">${s.r}</span><button data-d="r+" type="button" aria-label="${T(rl).replace(/<[^>]+>/g,'')} ＋">＋</button></div>`:''}</div>
     <div class="tdesc">${T(L['d'+t])}</div>`:`<div class="tdesc">${T(L.tapEmpty)}</div>`}
     <div class="row"><button class="btn ghost" id="delst" type="button">${T(L.delSt)}</button><button class="btn" id="edok" type="button">${T(L.close)}</button></div></div>`;

    case 'repeat':case 'powDir':case 'distinct':return kL.some(x=>x.t==='W');case 'noRepeat':return kL.some(x=>x.t==='P'||x.t==='C');case 'forgotSub':return !neg;default:return true}}
function diagnose(p,lanes,v){
  for(const m of p.mis)if(m.v===v&&misFits(m.tag,lanes,p))return {tag:m.tag,text:T(m.t)};
  const sol=p.sol;const kPos=lanes.filter(l=>l.sign>0).length,kNeg=lanes.length-kPos,sPos=sol.filter(l=>l.sign>0).length,sNeg=sol.length-sPos;
  const kL=lanes.flatMap(l=>l.st),sL=sol.flatMap(l=>l.st);
  if(sNeg&&!kNeg&&kPos===1)return {tag:'forgotSub',text:T(L.g_sub)};
  if(sPos>=2&&!sNeg&&lanes.length===1)return {tag:'mulForAdd',text:T(L.g_mulForAdd)};
  if(sol.length===1&&lanes.length>=2&&!kNeg)return {tag:'addForMul',text:T(L.g_addForMul)};
  // leaf comparison
  const pool=[...kL];const unmatched=[];
  for(const s of sL){const j=pool.findIndex(k=>leafVal(k)===leafVal(s));if(j>=0)pool.splice(j,1);else unmatched.push(s)}
  if(unmatched.length&&pool.length){const s=unmatched[0];
    const k=pool.find(k=>k.n===s.n&&k.r===s.r)||pool.find(k=>k.t===s.t)||pool.find(k=>k.n===s.n)||pool[0];const lab=T(s.lab);
    if(k.t==='W'&&s.t==='W'&&k.n===s.r&&k.r===s.n)return {tag:'powDir',text:T(L.g_powDir,{lab})};
    if(k.t!==s.t){
      if(k.t==='P'&&s.t==='C')return {tag:'PforC',text:T(L.g_PforC,{lab})};
      if(k.t==='C'&&s.t==='P')return {tag:'CforP',text:T(L.g_CforP,{lab})};
      if(s.t==='W'&&(k.t==='P'||k.t==='C'))return {tag:'noRepeat',text:T(L.g_toW,{lab})};
      if(k.t==='W'&&(s.t==='P'||s.t==='C'))return {tag:'repeat',text:T(L.g_fromW,{lab})};
      if(!(k.t==='N'||s.t==='N'))return {tag:'type',text:T(L.g_type,{lab})}}
    if(k.t===s.t&&k.n!==s.n)return {tag:'n',text:T(L.g_n,{lab})};
    if(k.t===s.t&&k.r!==s.r)return {tag:'r',text:T(L.g_r,{lab})};
    return {tag:'type',text:T(L.g_type,{lab})}}
  if(unmatched.length&&!pool.length)return {tag:'missing',text:T(L.g_more)};
  if(!unmatched.length&&pool.some(k=>leafVal(k)!==1))return {tag:'extra',text:T(L.g_less)};
  if(lanes.length!==sol.length)return {tag:'shape',text:sol.length>lanes.length?T(L.g_mulForAdd):T(L.g_addForMul)};
  return {tag:'other',text:T(L.g_generic)}}

    <li>${H('くばる表: Rota の Twelvefold Way の6マス(人に区別がある半分)','Hand-out table: the six cells of Rota’s Twelvefold Way where the people are distinguishable','分配表：Rota 十二重计数中“人有区别”的那6格')}</li>
    <li>${H('雨温図：気象庁「過去の気象データ」の平年値(1991–2020年)を加工して作成','Climate charts: made from JMA “Past weather data” normals (1991–2020), processed','气候图：根据日本气象厅“过去的气象数据”1991–2020年平年值加工制作')} — https://www.data.jma.go.jp/stats/etrn/</li>
    <li>${H('地図記号：国土地理院「地図記号一覧」をもとに かき直したもの','Map symbols: redrawn after GSI’s map-symbol list','地图符号：参照国土地理院“地图符号一览”重绘')} — https://www.gsi.go.jp/</li>
    <li>${H('都道府県の形：svg-japan 1.1.2 (ka2, MIT License)','Prefecture outlines: svg-japan 1.1.2 (ka2, MIT License)','都道府县轮廓：svg-japan 1.1.2（ka2，MIT 许可）')}</li>

    <li>three.js r128 (MIT License) · spectral.js 3.0.0 (Ronald van Wijnen, MIT License) — ${H('全文は THIRD_PARTY_LICENSES.md','full texts in THIRD_PARTY_LICENSES.md','全文见 THIRD_PARTY_LICENSES.md')}</li></ul></div>
   <div class="panel"><h3>${H('設定','Settings','设置')}</h3><div class="row" style="margin-top:8px">
    <button class="btn ghost" id="ua" type="button">${S.unlockAll?H('島の順番ロックを戻す','Re-lock islands in order','恢复按顺序解锁'):H('すべての島をひらく','Unlock all islands','解锁全部岛')}</button>
    <button class="btn ghost" id="rs" type="button">${H('進みをリセット','Reset progress','重置进度')}</button></div><div id="rsc"></div></div></div>`);
  $('#bk').onclick=()=>S.name?showMap():showTitle();
  $('#ua').onclick=()=>{S.unlockAll=!S.unlockAll;save();showParent()};
  $('#rs').onclick=()=>{$('#rsc').innerHTML=`<p>${H('本当にリセットしますか? 花・図鑑・記録がすべて消えます。(こうぼうで作った作品は のこります)','Really reset? Flowers, dex and records will all be erased. (Works made in the workshop are kept.)','确定要重置吗？花、图鉴和记录都会清空。（工坊里做的作品会保留）')}</p><button class="btn danger" id="rs2" type="button">${H('リセットする','Reset','确认重置')}</button>`;
    $('#rs2').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}const lang=S.lang;Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,{lang,name:'',buddy:'sora',sound:true,flowers:0,cleared:{},prog:{},prob:{},tags:{},cells:{},review:{date:'',streak:0},unlockAll:false,seen:{}});for(const k in ATTEMPT)delete ATTEMPT[k];if(HOOK.reset)HOOK.reset();save();renderTop();showTitle()}}}

// ---------- i18n audit (for testing): window.__i18nAudit() ----------
window.__i18nAudit=function(){AUDIT.on=true;AUDIT.list=[];
  for(const c of Object.keys(PROBLEMS))PROBLEMS[c].forEach((d,i)=>d.sets.forEach((_,si)=>getProblem(c,i,si)));
  const all=[...AUDIT.list,...Object.values(L),...Object.values(PRAISE),...Object.values(TAGS),...Object.values(SPECIES).flatMap(s=>[s.name,s.fact]),...ALLCH.flatMap(c=>[c.place,c.topic,...c.say]),...WORLDS.filter(w=>!w.main).flatMap(w=>[w.name,w.level,w.intro,w.lockTxt]),...Object.values(MOVES).flatMap(m=>[m.n,m.r,m.src].filter(x=>x&&typeof x==='object'))];
  all.push(...(window.EXTRA_TX||[]));AUDIT.on=false;return all.filter(o=>!['ja','en','zh'].every(k=>typeof o[k]==='string'&&o[k].length)).map(o=>JSON.stringify(o))};

window.addEventListener('DOMContentLoaded',()=>{renderTop();if(S.name)showMap();else showTitle()});
